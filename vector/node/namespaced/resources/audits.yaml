sources:
  kubernetes_events:
    type: kubernetes_logs
    extra_namespace_label_selector: "name=sys-falco"
    use_apiserver_cache: true
  kubernetes_apiserver:
    type: file
    include:
      - /var/log/kube-api-server/audit
  kubernetes_tetragon_events:
    type: "file"
    include: ["/var/run/cilium/tetragon/tetragon.log"]

transforms:
  kubernetes_events_remap:
    inputs:
      - kubernetes_events
    type: remap
    source: |
      .log_source = "kube_audits_events"
  kubernetes_apiserver_remap:
    inputs:
      - kubernetes_apiserver
    type: remap
    source: |
      .log_source = "kube_audits_apiserver"
  kubernetes_tetragon_remap:
    inputs:
      - kubernetes_tetragon_events
    type: remap
    source: |
      if is_string(.message) {
        parsed, err = parse_json(.message)
        if err == null && is_object(parsed) {
          parsed.product = "tetragon"
          .message = encode_json(parsed)
        }
      }

sinks:
  loki_audits:
    inputs:
      - kubernetes_events_remap
      - kubernetes_apiserver_remap
    type: loki
    endpoint: http://loki.sys-audit.svc.cluster.aws:3100
    encoding:
      codec: text
    labels:
      cloud_provider: "${CLOUD_PROVIDER}"
      uw_environment: "${UW_ENVIRONMENT}"
      kubernetes_cluster: "${KUBERNETES_CLUSTER}"
      log_source: "{{ log_source }}"
  # Raw tetragon JSON lines, newline-delimited and gzipped.
  s3_tetragon:
    type: aws_s3
    inputs:
      - kubernetes_tetragon_remap
    bucket: "${TETRAGON_S3_BUCKET}"
    region: "${AWS_REGION:-eu-west-1}"
    key_prefix: "tetragon/${KUBERNETES_CLUSTER}/%Y/%m/%d/%H/"
    encoding:
      codec: text
    framing:
      method: newline_delimited
    compression: gzip
    filename_extension: json.gz
    # Node-local disk buffer (hostPath /var/lib/vector) so a short S3 outage
    # does not stall the tetragon file source.
    buffer:
      type: disk
      max_size: 536870912 # 512 MiB
