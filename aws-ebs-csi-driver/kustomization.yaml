apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - github.com/kubernetes-sigs/aws-ebs-csi-driver/deploy/kubernetes/overlays/stable?ref=ac0ca0cad55aba6e33c69862f1c5fda293cee453 # v1.66.0

patches:
  - path: controller-patch.yaml
  - path: node-args-patch.yaml
  - path: node-liveness-patch.yaml
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: ebs-external-provisioner-role
    path: ebs-external-provisioner-role-patch.yaml
