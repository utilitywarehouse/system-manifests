apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - trident-controller-clusterrolebinding.yaml
  - trident-controller-clusterrole.yaml
  - trident-node-linux-clusterrolebinding.yaml
  - trident-node-linux-clusterrole.yaml
  - trident-crds.yaml
patches:
- target:
    group: rbac.authorization.k8s.io
    version: v1
    kind: ClusterRole
    name: trident-controller
  path: trident-controller-clusterrole-patch.yaml
