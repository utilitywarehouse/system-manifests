# https://github.com/grafana/k6-operator/tree/main/charts/k6-operator#values
installCRDs: true
namespace:
  create: false

manager:
  replicas: 1
  # chart 4.7.0 defaults logging.development to true (--zap-devel=true, DEBUG);
  # use production zap logging (JSON, INFO)
  logging:
    development: false
  serviceAccount:
    name: k6-operator-controller
    create: true
  image:
    registry: ghcr.io
    repository: grafana/k6-operator
    tag: controller-v1.7.0
    pullPolicy: IfNotPresent
  env: 
    - name: WATCH_NAMESPACE
      value: "sys-k6"
  resources:
    limits:
      cpu: 100m
      memory: 100Mi
    requests:
      cpu: 100m
      memory: 50Mi
  containerSecurityContext: {}
