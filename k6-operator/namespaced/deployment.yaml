# Source: k6-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-operator-controller-manager
  namespace: sys-k6
  labels:
    control-plane: "controller-manager"
    app.kubernetes.io/component: controller
    helm.sh/chart: k6-operator-4.7.0
    app.kubernetes.io/name: k6-operator
    app.kubernetes.io/instance: k6-operator
    app.kubernetes.io/version: "1.7.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: k6-operator
  annotations:
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k6-operator
      app.kubernetes.io/instance: k6-operator
  template:
    metadata:
      labels:
        control-plane: "controller-manager"
        app.kubernetes.io/name: k6-operator
        app.kubernetes.io/instance: k6-operator
    spec:
      containers:
        - name: manager
          image: "ghcr.io/grafana/k6-operator:controller-v1.7.0"
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 100m
              memory: 100Mi
            requests:
              cpu: 100m
              memory: 50Mi
          env:
            - name: WATCH_NAMESPACE
              value: sys-k6
          command:
            - /manager
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
            - --zap-devel=false
          ports:
            - containerPort: 8443
              name: https
      serviceAccountName: k6-operator-controller
      terminationGracePeriodSeconds: 10
