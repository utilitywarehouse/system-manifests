# this patch prepares this deployment to be converted in to StatefulSet
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  replicas: 3
  serviceName: argocd-repo-server # for StatefulSet specs
  template:
    spec:
      automountServiceAccountToken: true # for required for voodoobox plugin
      initContainers:
        - name: init-temp-cleanup
          image: busybox:latest
          command: ["sh", "-c", "rm -rf /tmp/* /cmp-tmp/*"] # clean up tmp pvc on re-start
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /cmp-tmp
              name: cmp-tmp
      containers:
        - name: voodoobox
          command: [/var/run/argocd/argocd-cmp-server]
          image: quay.io/utilitywarehouse/argocd-voodoobox-plugin:master
          env:
            # do not use debug level as it prints output from plugin which
            # will include secrets
            - name: ARGOCD_CMP_SERVER_LOGLEVEL
              value: info
            # Clusters that want the GitHub App credential create this secret.
            - name: AVP_GLOBAL_GIT_APP_ID
              valueFrom:
                secretKeyRef:
                  name: sys-argocd-app-creds
                  key: githubAppID
            - name: AVP_GLOBAL_GIT_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: sys-argocd-app-creds
                  key: githubAppInstallationID
            - name: AVP_GLOBAL_GIT_APP_PRIVATE_KEY_FILE
              value: /etc/github-app/app.pem
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          volumeMounts:
            - mountPath: /etc/github-app
              name: github-app
              readOnly: true
            - mountPath: /var/run/argocd
              name: var-files
            - mountPath: /home/argocd/cmp-server/plugins
              name: plugins
            - mountPath: /tmp
              name: cmp-tmp
            # Register plugins into sidecar
            - mountPath: /home/argocd/cmp-server/config/plugin.yaml
              subPath: avp.yaml
              name: argocd-voodoobox-plugin
          resources:
            requests:
              memory: 100Mi
              cpu: 0
            limits:
              cpu: 2
              memory: 1000Mi
        - name: argocd-repo-server
          resources:
            requests:
              memory: 100Mi
              cpu: 0
            limits:
              cpu: 2
              memory: 1000Mi
      securityContext:
        # https://argo-cd.readthedocs.io/en/stable/operator-manual/config-management-plugins/#register-the-plugin-sidecar
        fsGroup: 999
      volumes:
        - configMap:
            name: argocd-voodoobox-plugin
          name: argocd-voodoobox-plugin
        - name: github-app
          secret:
            secretName: sys-argocd-app-creds
            defaultMode: 0440
            items:
              - key: githubAppPrivateKey
                path: app.pem
        - $patch: delete
          name: tmp
  volumeClaimTemplates:
    - metadata:
        name: tmp
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: cmp-tmp
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
