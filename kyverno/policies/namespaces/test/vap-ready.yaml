# Kyverno generates a ValidatingAdmissionPolicy and a binding for every
# ValidatingPolicy that opts in with spec.autogen.validatingAdmissionPolicy.
# The assertions below pin the parts of the generated spec that encode the
# policy's intent (what it matches, what it checks), without asserting API
# server defaults.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vpol-require-delete-annotation-ns-label
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [DELETE]
        resources: [namespaces]
  (validations[*].messageExpression):
    - |-
      'Namespace "' + oldObject.metadata.name + '" must be annotated with: uw.systems/delete-allowed: "true" to be deleted'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: vpol-require-delete-annotation-ns-label-binding
spec:
  policyName: vpol-require-delete-annotation-ns-label
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vpol-require-ns-owner-label
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  # variables are copied into the policy so validations can use them
  (variables[*].name): [allowed_owners]
  (validations[*].message):
    - "The label `uw.systems/owner` is required. Check policy at https://github.com/utilitywarehouse/system-manifests/tree/master/kyverno/policies/namespaces/require-ns-owner-label.yaml for allowed label values."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: vpol-require-ns-owner-label-binding
spec:
  policyName: vpol-require-ns-owner-label
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vpol-restrict-limitrange-values
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [limitranges]
  (variables[*].name): [limits, max_cpu, max_memory]
  (validations[*].message):
    - "LimitRange max.cpu cannot exceed 6 cores."
    - "LimitRange max.memory cannot exceed 24Gi."
    - "LimitRange default.cpu cannot exceed 6 cores."
    - "LimitRange default.memory cannot exceed 24Gi."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: vpol-restrict-limitrange-values-binding
spec:
  policyName: vpol-restrict-limitrange-values
  validationActions: [Deny]
