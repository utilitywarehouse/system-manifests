# Kyverno generates a ValidatingAdmissionPolicy and a binding for every
# ValidatingPolicy that opts in with spec.autogen.validatingAdmissionPolicy.
# The assertions below pin the parts of the generated spec that encode the
# policy's intent, without asserting API server defaults.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vpol-argocd-application-field-validation
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [argoproj.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [applications]
  # Assert messages one by one: chainsaw parses list elements containing ':' as JMESPath.
  (validations[0].message): "`spec.project` should not be empty."
  (validations[1].message): "The `default` is a privileged project and it may not be used in an Application."
  (validations[2].message): "An Application must define exactly one: either `spec.source` OR `spec.sources`."
  (validations[3].message): "When using `spec.source`, a `path` must be defined."
  (validations[4].message): "Every entry in `spec.sources` must specify a `path`."
  (validations[5].message): "Helm charts are not permitted in `spec.source`. Please use a git path."
  (validations[6].message): "Helm charts are not permitted in `spec.sources`. All entries must use git paths."
  (validations[7].message): "`spec.destination.namespace` should not be empty."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: vpol-argocd-application-field-validation-binding
spec:
  policyName: vpol-argocd-application-field-validation
  validationActions: [Deny]
