apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: test-workloads-revision-history
spec:
  steps:
    - name: setup-prerequisites
      try:
        - apply:
            file: ../set-revision-history-limit.yaml

        - assert:
            timeout: 120s
            file: policy-ready.yaml

    - name: assert-map-generated
      try:
        - assert:
            timeout: 60s
            file: map-ready.yaml

    # The API server can take a moment to load a freshly generated policy, so
    # prove it mutates before asserting on the real fixtures.
    - name: wait-for-generated-policy
      try:
        - script:
            timeout: 120s
            content: |
              set -eu
              for i in $(seq 1 60); do
                name="policy-canary-$i"
                kubectl create deployment "$name" --image=nginx >/dev/null
                value=$(kubectl get deployment "$name" -o jsonpath='{.spec.revisionHistoryLimit}')
                kubectl delete deployment "$name" --wait=false >/dev/null 2>&1 || true
                if [ "$value" = "2" ]; then
                  exit 0
                fi
                sleep 1
              done
              echo "the generated policy did not mutate a canary deployment" >&2
              exit 1

    - name: test-resources
      try:
        - apply:
            file: resources.yaml

        # Workloads left at the default (or explicitly 10) are capped to 2.
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: without-revision-history
                namespace: default
              spec:
                revisionHistoryLimit: 2

        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: with-default-revision-history
                namespace: default
              spec:
                revisionHistoryLimit: 10

        - assert:
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: without-revision-history
                namespace: default
              spec:
                revisionHistoryLimit: 2

        - assert:
            resource:
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: without-revision-history
                namespace: default
              spec:
                revisionHistoryLimit: 2

        # An explicitly set non-default value is respected.
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: with-custom-revision-history
                namespace: default
              spec:
                revisionHistoryLimit: 5
