apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: test-user-namespaces
spec:
  steps:
    - name: apply-policy
      try:
        - apply:
            file: ../user-namespaces.yaml
        - assert:
            timeout: 120s
            file: policy-ready.yaml

    - name: test-user-namespaces
      try:
        - apply:
            timeout: 2m
            file: test-user-namespaces.yaml
        - assert:
            timeout: 30s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-user-ns-plain-pod-non-sys-ns
              spec:
                (hostUsers != false): true
        - assert:
            timeout: 30s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-user-ns-plain-pod
                namespace: sys-log
              spec:
                hostUsers: false
        - assert:
            timeout: 30s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-user-ns-hostnetwork-pod
                namespace: sys-log
              spec: {}
        - assert:
            timeout: 30s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-user-ns-hostpid-pod
                namespace: sys-log
              spec: {}
        - assert:
            timeout: 30s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-user-ns-hostipc-pod
                namespace: sys-log
              spec: {}
        - assert:
            timeout: 30s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-user-ns-hostpath-pod
                namespace: sys-log
              spec:
                volumes:
                  - name: ssl
                    hostPath:
                      path: /etc/kubernetes/ssl
                      type: Directory
        - assert:
            timeout: 30s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-user-ns-emptydir-pod
                namespace: sys-log
              spec:
                hostUsers: false
                volumes:
                  - name: data
                    emptyDir: {}
        - assert:
            timeout: 30s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-user-ns-nfs-pvc-pod
                namespace: sys-log
              spec:
                volumes:
                  - name: data
                    persistentVolumeClaim:
                      claimName: test-user-ns-nfs-pvc
        - assert:
            timeout: 30s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-user-ns-standard-pvc-pod
                namespace: sys-log
              spec:
                hostUsers: false
                volumes:
                  - name: data
                    persistentVolumeClaim:
                      claimName: test-user-ns-standard-pvc
        - assert:
            timeout: 30s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-user-ns-no-storageclass-pvc-pod
                namespace: sys-log
              spec:
                volumes:
                  - name: data
                    persistentVolumeClaim:
                      claimName: test-user-ns-no-storageclass-pvc
        - assert:
            timeout: 30s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-user-ns-missing-pvc-pod
                namespace: sys-log
              spec:
                volumes:
                  - name: data
                    persistentVolumeClaim:
                      claimName: test-user-ns-missing-pvc
