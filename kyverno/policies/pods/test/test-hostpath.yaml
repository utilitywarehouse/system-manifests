apiVersion: v1
kind: Pod
metadata:
  name: test-hostpath-none
spec:
  containers:
    - name: test
      image: alpine
---
apiVersion: v1
kind: Pod
metadata:
  name: test-hostpath-emptydir
spec:
  containers:
    - name: test
      image: alpine
  volumes:
    - name: cache-volume
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: test-hostpath-forbidden
spec:
  containers:
    - name: test
      image: alpine
  volumes:
    - name: task-pv-storage
      hostPath:
        path: /data
        type: Directory
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: calico-node-hostpath-vols
  namespace: kube-system
spec:
  policyRefs:
    - name: hostpath-vols
      kind: ValidatingPolicy
  matchConditions:
    - name: calico-node-hostpath-vols
      expression: >-
        object.metadata.?namespace.orValue('') == 'kube-system' &&
        object.metadata.name.startsWith('test-hostpath-exception') &&
        (
          has(object.spec.template) ? object.spec.template.spec :
          has(object.spec.jobTemplate) ? object.spec.jobTemplate.spec.template.spec :
          object.spec
        ).?volumes.orValue([]).all(v,
          !has(v.hostPath) || !has(v.hostPath.path) || v.hostPath.path in ['/usr/share/ca-certificates', '/lib/modules', '/var/run/calico']
        )
---
apiVersion: v1
kind: Pod
metadata:
  name: test-hostpath-exception-allowed
  namespace: kube-system
spec:
  containers:
    - name: test
      image: alpine
  volumes:
    - hostPath:
        path: /usr/share/ca-certificates
        type: ""
      name: ssl-certs
    - hostPath:
        path: /lib/modules
        type: ""
      name: lib-modules
    - hostPath:
        path: /var/run/calico
        type: DirectoryOrCreate
      name: var-run-calico
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-hostpath-exception-deployment-allow
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-hostpath-exception-deployment-allow
  template:
    metadata:
      labels:
        app: test-hostpath-exception-deployment-allow
    spec:
      containers:
        - name: test
          image: alpine
      volumes:
        - hostPath:
            path: /usr/share/ca-certificates
            type: ""
          name: ssl-certs
        - hostPath:
            path: /lib/modules
            type: ""
          name: lib-modules
        - hostPath:
            path: /var/run/calico
            type: DirectoryOrCreate
          name: var-run-calico
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-hostpath-deployment-allow
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-hostpath-deployment-allow
  template:
    metadata:
      labels:
        app: test-hostpath-deployment-allow
    spec:
      containers:
        - name: test
          image: alpine
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: test-hostpath-cronjob-fail
  namespace: default
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: test
              image: alpine
              volumeMounts:
                - name: host
                  mountPath: /host
          volumes:
            - name: host
              hostPath:
                path: /data
                type: Directory
