apiVersion: v1
kind: Pod
metadata:
  name: test-privilege-escalation-not-set
spec:
  containers:
    - name: test
      image: test
---
apiVersion: v1
kind: Pod
metadata:
  name: test-privilege-escalation-set-to-false
spec:
  containers:
    - name: test
      image: test
      securityContext:
        allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Pod
metadata:
  name: test-privilege-escalation-set-to-true
spec:
  containers:
    - name: test
      image: test
      securityContext:
        allowPrivilegeEscalation: true
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: trident-disallow-privilege-escalation
  namespace: kube-system
spec:
  policyRefs:
    - name: disallow-privilege-escalation
      kind: ValidatingPolicy
  matchConditions:
    - name: trident-disallow-privilege-escalation
      expression: >-
        object.metadata.?namespace.orValue('') == 'default' &&
        object.metadata.name.startsWith('test-privilege-escalation-set-to-true-exception')
---
apiVersion: v1
kind: Pod
metadata:
  name: test-privilege-escalation-set-to-true-exception-allowed
  namespace: default
spec:
  containers:
    - name: test
      image: test
      securityContext:
        allowPrivilegeEscalation: true
---
# Privileged Container Tests
apiVersion: v1
kind: Pod
metadata:
  name: test-privileged-container-fail
spec:
  containers:
    - name: test
      image: alpine
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: test-privileged-container-pass
spec:
  containers:
    - name: test
      image: alpine
      securityContext:
        privileged: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-privileged-deployment-fail
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-privileged-deployment-fail
  template:
    metadata:
      labels:
        app: test-privileged-deployment-fail
    spec:
      containers:
        - name: test
          image: alpine
          securityContext:
            privileged: true
