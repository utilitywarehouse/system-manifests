# Based on: https://kyverno.io/policies/other/limit-hostpath-vols/limit-hostpath-vols/
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: hostpath-vols
  annotations:
    policies.kyverno.io/title: Limit hostPath Volumes to Specific Directories
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      hostPath volumes consume the underlying node's file system. Mounting host
      paths should be disabled by default, except for specific cases
spec:
  autogen:
    validatingAdmissionPolicy:
      enabled: true
    podControllers:
      controllers: []
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: >-
        has(object.spec.template) ? object.spec.template.spec :
        has(object.spec.jobTemplate) ? object.spec.jobTemplate.spec.template.spec :
        object.spec

  validations:
    - message: HostPath volumes are not allowed.
      expression: >-
        !has(variables.podSpec.volumes) ||
        variables.podSpec.volumes.all(v, !has(v.hostPath))
