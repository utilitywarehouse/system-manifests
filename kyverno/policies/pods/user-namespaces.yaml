apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: enforce-user-namespaces
spec:
  autogen:
    mutatingAdmissionPolicy:
      enabled: false
    podControllers:
      controllers: []

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]

  matchConditions:
    # https://kubernetes.io/docs/concepts/workloads/pods/user-namespaces/#limitations
    - name: exclude-host-namespaces
      expression: >-
        !(
          object.spec.?hostNetwork.orValue(false) ||
          object.spec.?hostPID.orValue(false) ||
          object.spec.?hostIPC.orValue(false)
        )
    # failed to fulfil mount request: failed to set MOUNT_ATTR_IDMAP on /dev: invalid
    # argument (maybe the filesystem used doesn't support idmap mounts on this kernel?
    - name: exclude-hostpath-volumes
      expression: >-
        object.spec.?volumes.orValue([]).all(v,
          !has(v.hostPath)
        )
    # NFS volumes cannot be mounted in a user-namespace pod because Linux NFS
    # client doesn't yet support idmap mounts.
    # https://kubernetes.io/docs/concepts/workloads/pods/user-namespaces/#limitations
    # Excluding all pods that mount PVCs with no StorageClass, as these PVCs
    # use NFS-backed PVs.
    - name: exclude-pods-with-nfs-volumes
      expression: >-
        !object.spec.?volumes.orValue([]).exists(v,
          has(v.persistentVolumeClaim) &&
          resource.Get("v1", "persistentvolumeclaims", object.metadata.namespace, v.persistentVolumeClaim.claimName)
            .?spec.storageClassName.orValue("") == ""
        )
    # SMB volumes (csi-driver-smb) cannot be mounted in a user-namespace pod
    # because the Linux CIFS client doesn't support idmap mounts:
    # failed to set MOUNT_ATTR_IDMAP ... invalid argument
    # Excluding all pods that mount a PVC that is either:
    #  - on a StorageClass provisioned by smb.csi.k8s.io (dynamic provisioning,
    #    works while the PVC is still unbound), or
    #  - bound (volumeName set) to a PV served by the SMB CSI driver (static
    #    PVs, whose PVC may name a StorageClass that does not exist).
    # Each PVC is fetched once (map), then at most one StorageClass and one PV
    # lookup per PVC.
    - name: exclude-pods-with-smb-volumes
      expression: >-
        !object.spec.?volumes.orValue([])
          .filter(v, has(v.persistentVolumeClaim))
          .map(v, resource.Get("v1", "persistentvolumeclaims", object.metadata.namespace, v.persistentVolumeClaim.claimName))
          .exists(pvc,
            (
              pvc.?spec.storageClassName.orValue("") != "" &&
              resource.Get("storage.k8s.io/v1", "storageclasses", "", pvc.spec.storageClassName)
                .?provisioner.orValue("") == "smb.csi.k8s.io"
            ) || (
              pvc.?spec.volumeName.orValue("") != "" &&
              resource.Get("v1", "persistentvolumes", "", pvc.spec.volumeName)
                .?spec.csi.driver.orValue("") == "smb.csi.k8s.io"
            )
          )

  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              hostUsers: false
            }
          }
