apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: pod-capabilities
  annotations:
    policies.kyverno.io/title: Pod Capabilities
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Adding capabilities other than `NET_BIND_SERVICE` is disallowed. Rules
      with exeptions for particular workloads must be added here. Default rule
      maps Kubernetes restricted pod security standard
spec:
  autogen:
    validatingAdmissionPolicy:
      enabled: true
    podControllers:
      controllers: []
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: >-
        has(object.spec.template) ? object.spec.template.spec :
        has(object.spec.jobTemplate) ? object.spec.jobTemplate.spec.template.spec :
        object.spec
    - name: allContainers
      expression: >-
        variables.podSpec.?containers.orValue([]) + 
        variables.podSpec.?initContainers.orValue([]) + 
        variables.podSpec.?ephemeralContainers.orValue([])

  validations:
    - message: Any capabilities added other than NET_BIND_SERVICE are disallowed.
      expression: >-
        variables.allContainers.all(c, 
          c.?securityContext.?capabilities.?add.orValue([]).all(cap, cap in ['NET_BIND_SERVICE', ''])
        )
