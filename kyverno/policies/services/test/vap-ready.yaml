---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vpol-mirror-name-length
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [services]
    objectSelector:
      matchLabels:
        uw.systems/mirror: "true"
  (validations[*].message):
    - "Mirror service controller should be able to generate 63 chars long mirrored names with prefixes [aws|gcp|merit] and pattern <prefix>-<namespace>-73736d-<service-name>"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: vpol-mirror-name-length-binding
spec:
  policyName: vpol-mirror-name-length
  validationActions: [Deny]
