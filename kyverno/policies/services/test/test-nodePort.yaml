apiVersion: v1
kind: Service
metadata:
  name: test-nodeport-not-set
spec:
  type: ClusterIP
  ports:
    - name: dummy
      port: 12345
      protocol: TCP
      targetPort: 12345
---
apiVersion: v1
kind: Service
metadata:
  name: test-nodeport-not-allowed
spec:
  type: NodePort
  ports:
    - name: dummy
      nodePort: 30001
      port: 30001
      protocol: TCP
      targetPort: 30001
---
apiVersion: v1
kind: Service
metadata:
  name: test-nodeport-exception-allowed
  namespace: default
spec:
  type: NodePort
  ports:
    - name: udp
      nodePort: 30961
      port: 9060
      protocol: UDP
      targetPort: 9060
---
apiVersion: v1
kind: Service
metadata:
  name: test-nodeport-exception-allowed-two
  namespace: default
spec:
  type: NodePort
  ports:
    - name: udp
      nodePort: 30962
      port: 9061
      protocol: UDP
      targetPort: 9061
