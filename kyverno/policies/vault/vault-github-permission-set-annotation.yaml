apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: vault-github-permission-set
  annotations:
    policies.kyverno.io/title: Validate Vault GitHub permission set annotation
    policies.kyverno.io/category: Operations
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Vault
    policies.kyverno.io/description: >-
      Verify that a Pod requesting the github vault sidecar
      (`uw.systems/kyverno-inject-sidecar-request-github`) also carries a
      `github.uw.systems/permission-set` annotation naming which
      vault-plugin-secrets-github permission set to fetch a token for.
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: requests-github-sidecar
      expression: >-
        object.metadata.?annotations['uw.systems/kyverno-inject-sidecar-request-github'].orValue('') == 'true'
  validations:
    - expression: >-
        has(object.metadata.annotations) &&
        'github.uw.systems/permission-set' in object.metadata.annotations &&
        object.metadata.annotations['github.uw.systems/permission-set'].matches('^[a-zA-Z0-9_-]+$')
      message: >-
        Pods requesting the github vault sidecar must carry a
        `github.uw.systems/permission-set` annotation matching ^[a-zA-Z0-9_-]+$
