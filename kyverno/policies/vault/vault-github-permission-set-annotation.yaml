apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: vault-github-permission-set
  annotations:
    policies.kyverno.io/title: Validate Vault GitHub permission set annotation
    policies.kyverno.io/category: Operations
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Vault
    policies.kyverno.io/description: >-
      Verify that a Pod requesting the github vault sidecar
      (`vault.uw.systems/github-credentials`) also carries a
      `github.uw.systems/permission-set` annotation naming which
      vault-plugin-secrets-github permission set to fetch a token for.
spec:
  autogen:
    validatingAdmissionPolicy:
      enabled: true
    podControllers:
      controllers: []
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podMetadata
      expression: >-
        has(object.spec.template) ? object.spec.template.metadata :
        has(object.spec.jobTemplate) ? object.spec.jobTemplate.spec.template.metadata :
        object.metadata
  matchConditions:
    - name: requests-github-sidecar
      expression: >-
        (
          has(object.spec.template) ? object.spec.template.metadata :
          has(object.spec.jobTemplate) ? object.spec.jobTemplate.spec.template.metadata :
          object.metadata
        ).?annotations['vault.uw.systems/github-credentials'].orValue('') == 'token-file'
  validations:
    - expression: >-
        has(variables.podMetadata.annotations) &&
        'github.uw.systems/permission-set' in variables.podMetadata.annotations &&
        variables.podMetadata.annotations['github.uw.systems/permission-set'].matches('^[a-zA-Z0-9_-]+$')
      message: >-
        Pods requesting the github vault sidecar must carry a
        `github.uw.systems/permission-set` annotation matching ^[a-zA-Z0-9_-]+$
