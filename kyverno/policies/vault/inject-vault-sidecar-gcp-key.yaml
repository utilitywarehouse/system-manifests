apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: inject-vault-sidecar-gcp-key
  labels:
    uw.systems/kyverno-policy-group: vault-sidecar-injector
  annotations:
    policies.kyverno.io/title: Inject Sidecar - GCP Key
spec:
  autogen:
    mutatingAdmissionPolicy:
      enabled: false
    podControllers:
      controllers: [] # disable autogen for other resources

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]

  matchConditions:
    - name: match-gcp-key-annotation
      expression: >-
        object.metadata.?annotations['vault.uw.systems/gcp-credentials'].orValue('') == 'key-file' ||
        object.metadata.?annotations['uw.systems/kyverno-inject-sidecar-request'].orValue('') == 'vault-sidecar-gcp-key'
    # Skip already-injected pods so re-invocation can't add a duplicate.
    - name: not-already-injected
      expression: >-
        !object.spec.?initContainers.orValue([]).exists(c, c.?name.orValue('') == 'vault-credentials-agent-gcp-key')

  variables:
    - name: vkac_env
      expression: "'test-env'"
    - name: pod_namespace
      expression: "object.metadata.?namespace.orValue('default')"
    - name: pod_sa
      expression: "object.spec.?serviceAccountName.orValue('default')"
    - name: vault_static_account
      expression: >-
        variables.vkac_env + "_gcp_" + variables.pod_namespace + "_" + variables.pod_sa

  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            metadata: Object.metadata{
              annotations: { "uw.systems/kyverno-inject-sidecar-status": "injected" }
            },
            spec: Object.spec{
              // Point existing initContainers at the credentials endpoint.
              initContainers: (has(object.spec.initContainers) ?
                  object.spec.initContainers.map(c,
                    Object.spec.initContainers{
                      name: c.name,
                      env: [
                        Object.spec.initContainers.env{ name: "GOOGLE_APPLICATION_CREDENTIALS", value: "/gcp/sa.json" }
                      ],
                      volumeMounts: [
                        Object.spec.initContainers.volumeMounts{ name: "gcp", mountPath: "/gcp" }
                      ]
                    }
                  ) : []) +
                [
                  // Append the vault credentials sidecar.
                  Object.spec.initContainers{
                    name: "vault-credentials-agent-gcp-key",
                    image: "quay.io/utilitywarehouse/vault-kube-cloud-credentials:v0.10.3",
                    restartPolicy: "Always",
                    env: [
                      Object.spec.initContainers.env{ name: "GOOGLE_APPLICATION_CREDENTIALS", value: "/gcp/sa.json" },
                      Object.spec.initContainers.env{ name: "VKCC_VAULT_STATIC_ACCOUNT", value: variables.vault_static_account },
                      Object.spec.initContainers.env{ name: "VKCC_SECRET_TYPE", value: "service_account_key" },
                      Object.spec.initContainers.env{ name: "VKCC_LISTEN_ADDRESS", value: "127.0.0.1:8298" },
                      Object.spec.initContainers.env{ name: "VKCC_OPERATIONAL_ADDRESS", value: ":8299" },
                      Object.spec.initContainers.env{ name: "VAULT_CAURL", value: "http://vault-ca-cert.sys-vault:8100" },
                      Object.spec.initContainers.env{ name: "VAULT_ADDR", value: "https://vault.sys-vault:8200" }
                    ],
                    volumeMounts: [
                      Object.spec.initContainers.volumeMounts{ name: "gcp", mountPath: "/gcp" }
                    ],
                    ports: [
                      Object.spec.initContainers.ports{ name: "metrics", containerPort: 8299, protocol: "TCP" }
                    ],
                    startupProbe: Object.spec.initContainers.startupProbe{
                      httpGet: Object.spec.initContainers.startupProbe.httpGet{ path: "/__/ready", port: 8299 },
                      failureThreshold: 5,
                      periodSeconds: 15
                    },
                    resources: Object.spec.initContainers.resources{
                      requests: {"cpu": "0m", "memory": "25Mi"},
                      limits: {"cpu": "1000m", "memory": "100Mi"}
                    }
                  }
                ],
              // Point existing containers at the credentials endpoint too.
              containers: has(object.spec.containers) ?
                object.spec.containers.map(c,
                  Object.spec.containers{
                    name: c.name,
                    env: [
                      Object.spec.containers.env{ name: "GOOGLE_APPLICATION_CREDENTIALS", value: "/gcp/sa.json" }
                    ],
                    volumeMounts: [
                      Object.spec.containers.volumeMounts{ name: "gcp", mountPath: "/gcp" }
                    ]
                  }
                ) : [],
              volumes: [
                Object.spec.volumes{ name: "gcp", emptyDir: Object.spec.volumes.emptyDir{} }
              ]
            }
          }
