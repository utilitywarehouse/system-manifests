apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: inject-vault-sidecar-aws
  labels:
    uw.systems/kyverno-policy-group: vault-sidecar-injector
  annotations:
    policies.kyverno.io/title: Inject Sidecar - AWS
spec:
  autogen:
    mutatingAdmissionPolicy:
      enabled: false
    podControllers:
      controllers: [] # disable autogen for other resources

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]

  matchConditions:
    - name: match-aws-annotation
      expression: >-
        object.metadata.?annotations['uw.systems/kyverno-inject-sidecar-request-aws'].orValue('') == 'true' ||
        object.metadata.?annotations['uw.systems/kyverno-inject-sidecar-request'].orValue('') == 'vault-sidecar-aws'

  variables:
    - name: vkac_env
      expression: "'test-env'"
    - name: pod_namespace
      expression: "object.metadata.?namespace.orValue('default')"
    - name: pod_sa
      expression: "object.spec.?serviceAccountName.orValue('default')"

    # Fail-open is a pod-wide toggle (uw.systems/kyverno-inject-sidecar-fail-open)
    # rather than a separate annotation/policy - it just decides which of the
    # two payloads below gets injected. This is only honoured for pods on the
    # new annotation; old-annotation pods use the dedicated, untouched
    # inject-vault-sidecar-aws-fail-open policy instead, which this policy
    # never matches or overlaps with.
    - name: fail_open
      expression: >-
        object.metadata.?annotations['uw.systems/kyverno-inject-sidecar-fail-open'].orValue('') == 'true'

    - name: sidecar_payload
      expression: |
        yaml.parse('''
          name: vault-credentials-agent-aws
          image: quay.io/utilitywarehouse/vault-kube-cloud-credentials:v0.10.0
          restartPolicy: Always
        ''' + (variables.fail_open ? '' : '''
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "while ! nc -w 1 127.0.0.1 8498; do sleep 1; done"
        ''') + '''
          args:
            - sidecar
            - -vault-role=''' + variables.vkac_env + '''_aws_''' + variables.pod_namespace + '''_''' + variables.pod_sa + '''
            - -listen-address=127.0.0.1:8498
            - -operational-address=:8499
          env:
            - name: VAULT_CAURL
              value: "http://vault-ca-cert.sys-vault:8100"
            - name: VAULT_ADDR
              value: "https://vault.sys-vault:8200"
          ports:
            - name: metrics
              containerPort: 8499
              protocol: TCP
          resources:
            requests:
              cpu: 0m
              memory: 25Mi
            limits:
              cpu: 1000m
              memory: 100Mi
        ''')

  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{
              annotations: {
                "uw.systems/kyverno-inject-sidecar-status": "injected"
              }
            },
            spec: Object.spec{
              initContainers: has(object.spec.initContainers) ?
                object.spec.initContainers.map(c,
                  Object.spec.initContainers{
                    name: c.name,
                    env: [
                      Object.spec.initContainers.env{ name: "AWS_CONTAINER_CREDENTIALS_FULL_URI", value: "http://127.0.0.1:8498/credentials" }
                    ]
                  }
                ) : [],
              containers: has(object.spec.containers) ?
                  object.spec.containers.map(c,
                    Object.spec.containers{
                      name: c.name,
                      env: [
                        Object.spec.containers.env{ name: "AWS_CONTAINER_CREDENTIALS_FULL_URI", value: "http://127.0.0.1:8498/credentials" }
                      ]
                    }
                ) : []
            }
          }

    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          size(object.spec.?initContainers.orValue([])) > 0
            ? [JSONPatch{op: "add", path: "/spec/initContainers/-", value: variables.sidecar_payload}]
            : [JSONPatch{op: "add", path: "/spec/initContainers", value: [variables.sidecar_payload]}]
