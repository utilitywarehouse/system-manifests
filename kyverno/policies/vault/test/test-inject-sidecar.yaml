# Pods for Rule: inject-vault-sidecar-aws
apiVersion: v1
kind: Pod
metadata:
  name: test-aws-uw
  annotations:
    uw.systems/kyverno-inject-sidecar-request-aws: "true"
spec:
  containers: [{ name: app, image: alpine }, { name: backend, image: alpine }]
---
# Pods for Rule: inject-vault-sidecar-aws-gcp
apiVersion: v1
kind: Pod
metadata:
  name: test-aws-gcp-uw
  annotations:
    uw.systems/kyverno-inject-sidecar-request: "vault-sidecar-aws-gcp"
spec:
  initContainers: [{ name: init, image: alpine }]
  containers: [{ name: app, image: alpine }, { name: backend, image: alpine }]
---
# Pod for Rule: inject-vault-sidecar-gcp-key
apiVersion: v1
kind: Pod
metadata:
  name: test-gcp-key
  annotations:
    uw.systems/kyverno-inject-sidecar-request-gcp-key: "true"
spec:
  containers: [{ name: app, image: alpine }]
---
# Pod for Rule: inject-vault-sidecar-gcp-token
apiVersion: v1
kind: Pod
metadata:
  name: test-gcp-token
  annotations:
    uw.systems/kyverno-inject-sidecar-request-gcp-token: "true"
spec:
  containers: [{ name: app, image: alpine }]
---
# Pod for Rule: inject-vault-sidecar-aws-gcp-key
apiVersion: v1
kind: Pod
metadata:
  name: test-aws-gcp-key
  annotations:
    uw.systems/kyverno-inject-sidecar-request: "vault-sidecar-aws-gcp-key"
spec:
  containers: [{ name: app, image: alpine }]
---
# Pods for Rule: inject-vault-init-container-aws
apiVersion: v1
kind: Pod
metadata:
  name: test-init-aws-uw
  annotations:
    uw.systems/kyverno-inject-sidecar-request-aws-init: "true"
spec:
  initContainers: [{ name: init, image: alpine }]
  containers: [{ name: app, image: alpine }]
---
# Pod for Rule: inject-vault-sidecar-github
apiVersion: v1
kind: Pod
metadata:
  name: test-github
  annotations:
    uw.systems/kyverno-inject-sidecar-request-github: "true"
    github.uw.systems/permission-set: "uw_ro"
spec:
  containers: [{ name: app, image: alpine }]
---
# Pod exercising TWO independent capabilities on one pod (aws + github), proving
# the two policies fire independently with no container-name/port collision.
apiVersion: v1
kind: Pod
metadata:
  name: test-aws-and-github
  annotations:
    uw.systems/kyverno-inject-sidecar-request-aws: "true"
    uw.systems/kyverno-inject-sidecar-request-github: "true"
    github.uw.systems/permission-set: "uw_ro"
spec:
  containers: [{ name: app, image: alpine }]
---
# Pod exercising aws + gcp-token via two new-scheme annotations on one pod -
# the new-scheme replacement for the legacy vault-sidecar-aws-gcp combo value,
# proving the two plain policies compose without a dedicated combo policy.
apiVersion: v1
kind: Pod
metadata:
  name: test-aws-and-gcp-token
  annotations:
    uw.systems/kyverno-inject-sidecar-request-aws: "true"
    uw.systems/kyverno-inject-sidecar-request-gcp-token: "true"
spec:
  containers: [{ name: app, image: alpine }]
---
# Fail-open Variants
apiVersion: v1
kind: Pod
metadata:
  name: test-aws-fail-open
  annotations:
    uw.systems/kyverno-inject-sidecar-request-aws: "true"
    uw.systems/kyverno-inject-sidecar-fail-open: "true"
spec:
  containers: [{ name: app, image: alpine }]
---
apiVersion: v1
kind: Pod
metadata:
  name: test-aws-gcp-fail-open
  annotations:
    uw.systems/kyverno-inject-sidecar-request: "vault-sidecar-aws-gcp-fail-open"
spec:
  containers: [{ name: app, image: alpine }]
---
apiVersion: v1
kind: Pod
metadata:
  name: test-gcp-token-fail-open
  annotations:
    uw.systems/kyverno-inject-sidecar-request-gcp-token: "true"
    uw.systems/kyverno-inject-sidecar-fail-open: "true"
spec:
  containers: [{ name: app, image: alpine }]
---
# Old plain-value annotation on the four policies extended in place (not a
# separate policy) - proves an old-annotation pod still matches, and gets the
# same new container name/ports as the new-key pods above, immediately on
# rollout.
apiVersion: v1
kind: Pod
metadata:
  name: test-aws-old
  annotations:
    uw.systems/kyverno-inject-sidecar-request: vault-sidecar-aws
spec:
  containers: [{ name: app, image: alpine }]
---
apiVersion: v1
kind: Pod
metadata:
  name: test-gcp-key-old
  annotations:
    uw.systems/kyverno-inject-sidecar-request: vault-sidecar-gcp-key
spec:
  containers: [{ name: app, image: alpine }]
---
apiVersion: v1
kind: Pod
metadata:
  name: test-gcp-token-old
  annotations:
    uw.systems/kyverno-inject-sidecar-request: vault-sidecar-gcp-token
spec:
  containers: [{ name: app, image: alpine }]
---
apiVersion: v1
kind: Pod
metadata:
  name: test-init-aws-old
  annotations:
    uw.systems/kyverno-inject-sidecar-request: vault-init-container-aws
spec:
  initContainers: [{ name: init, image: alpine }]
  containers: [{ name: app, image: alpine }]
---
# Fail-open Variants (old scheme) - handled entirely by the dedicated,
# untouched old fail-open policies; the new shared flag plays no part here.
apiVersion: v1
kind: Pod
metadata:
  name: test-aws-fail-open-old
  annotations:
    uw.systems/kyverno-inject-sidecar-request: vault-sidecar-aws-fail-open
spec:
  containers: [{ name: app, image: alpine }]
---
apiVersion: v1
kind: Pod
metadata:
  name: test-gcp-token-fail-open-old
  annotations:
    uw.systems/kyverno-inject-sidecar-request: vault-sidecar-gcp-token-fail-open
spec:
  containers: [{ name: app, image: alpine }]
