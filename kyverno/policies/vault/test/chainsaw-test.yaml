                name: test-aws-and-github
                annotations:
                  uw.systems/kyverno-inject-sidecar-status: "injected"
              spec:
                (length(initContainers)): 2
                (initContainers[?name=='vault-credentials-agent-aws']):
                  - image: quay.io/utilitywarehouse/vault-kube-cloud-credentials:v0.10.0
                    restartPolicy: Always
                    args:
                      - sidecar
                      - (join('', ['-vault-role=test-env_aws_', $namespace, '_default']))
                    ports:
                      - name: metrics
                        containerPort: 8099
                        protocol: TCP
                (initContainers[?name=='vault-credentials-agent-github']):
                  - image: quay.io/utilitywarehouse/vault-kube-cloud-credentials:v0.10.0
                    restartPolicy: Always
                    args:
                      - sidecar
                      - -vault-role=k8s_github_uw_ro
                      - -github-permission-set=uw_ro
                      - -listen-address=127.0.0.1:8398
                      - -operational-address=:8399
                    ports:
                      - name: metrics
