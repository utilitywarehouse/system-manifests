                      - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                containers:
                  - name: app
                    env:
                      - name: AWS_CONTAINER_CREDENTIALS_FULL_URI
                        value: "http://127.0.0.1:8098/credentials"
                      - name: GOOGLE_APPLICATION_CREDENTIALS
                        value: "/gcp/sa.json"
                    volumeMounts:
                      - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                      - name: gcp
                        mountPath: /gcp

    - name: inject-vault-init-container-aws
      try:
        - assert:
            timeout: 30s
            bindings:
              - name: expected_script
                value: |
                  echo '
                  exit_after_auth = true
                  auto_auth {
                          method "kubernetes" {
                              mount_path = "auth/kubernetes"
                              config = {
                                  role = "test-env_aws_test-namespace_default"
                              }
                              exit_on_err = true
                          }

                          sink "file" {
                              config = {
                                  path = "/home/vault/.vault-token"
                              }
                          }
                  }
                  template {
                      destination = "/etc/aws/credentials"
                      contents = <<EOT
                  {{ with secret "aws/sts/test-env_aws_test-namespace_default" -}}
                  [default]
                  aws_access_key_id={{ .Data.access_key }}
                  aws_secret_access_key={{ .Data.secret_key }}
                  aws_session_token={{ .Data.security_token }}

                  ; debug info
                  ; request_id={{ .RequestID }}
                  ; lease_id={{ .LeaseID }}
                  ; renewable={{ .Renewable }}
                  ; lease_duration={{ .LeaseDuration }}
                  ; arn={{ .Data.arn }}
                  ; warnings={{ .Warnings }}

                  {{ end -}}
                  EOT
                  }
                  ' > config.hcl

                  # The first DNS lookup from a fresh pod can transiently fail
                  # (kubernetes "first query" conntrack race). Retry with a backoff
                  # so a single dropped lookup does not fail the one-shot init
                  # container.
                  attempts=0
                  until wget -qO ca.crt $VAULT_CAURL; do
                    attempts=$((attempts+1))
                    if [ "$attempts" -ge 5 ]; then
                      echo "failed to fetch vault CA after $attempts attempts" >&2
                      exit 1
                    fi
                    echo "vault CA fetch attempt $attempts failed, retrying" >&2
                    sleep 5
                  done
                  vault agent -ca-cert ca.crt -config=config.hcl
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-init-aws-uw
                annotations:
                  uw.systems/kyverno-inject-sidecar-status: "injected"
              spec:
                volumes:
                  - projected:
                      defaultMode: 420
                  - name: vault-aws-credentials
                    emptyDir: {}
                initContainers:
                  - name: vault-credentials
                    image: docker.io/hashicorp/vault:1.15.2
                    command:
                      - sh
                      - -c
                      - (replace_all($expected_script, 'test-namespace', $namespace))
                    env:
                      - name: AWS_SHARED_CREDENTIALS_FILE
                        value: "/etc/aws/credentials"
                      - *vault-caurl
                      - *vault-addr
                    volumeMounts:
                      - name: vault-aws-credentials
                        mountPath: /etc/aws
                      - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                  - name: init
                    env:
                      - name: AWS_SHARED_CREDENTIALS_FILE
                        value: "/etc/aws/credentials"
                    volumeMounts:
                      - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                      - name: vault-aws-credentials
                        mountPath: /etc/aws
                containers:
                  - name: app
                    env:
                      - name: AWS_SHARED_CREDENTIALS_FILE
                        value: "/etc/aws/credentials"
                    volumeMounts:
                      - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                      - name: vault-aws-credentials
                        mountPath: /etc/aws

