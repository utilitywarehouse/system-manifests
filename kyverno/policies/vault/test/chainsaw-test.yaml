      try:
        - assert:
            timeout: 30s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-aws-gcp-key
              spec:
                volumes:
                  - projected:
                      defaultMode: 420
                  - name: gcp
                    emptyDir: {}
                initContainers:
                  - name: vault-credentials-agent-aws
                    <<: *aws-agent-base
                  - name: vault-credentials-agent-gcp
                    image: quay.io/utilitywarehouse/vault-kube-cloud-credentials:v0.10.0
