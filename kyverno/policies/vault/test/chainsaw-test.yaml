apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: test-service-accounts-policies
spec:
  steps:
    - name: apply-policies
      try:
        - apply:
            file: ../vault-annotation.yaml
        - apply:
            file: ../inject-vault-sidecar-aws-fail-open.yaml
        - apply:
            file: ../inject-vault-sidecar-aws-gcp-fail-open.yaml
        - apply:
            file: ../inject-vault-sidecar-aws-gcp-key.yaml
        - apply:
            file: ../inject-vault-sidecar-aws-gcp.yaml
        - apply:
            file: ../inject-vault-sidecar-aws.yaml
        - apply:
            file: ../inject-vault-sidecar-gcp-key.yaml
        - apply:
            file: ../inject-vault-sidecar-gcp-token-fail-open.yaml
        - apply:
            file: ../inject-vault-sidecar-gcp-token.yaml
        - apply:
            file: ../inject-vault-init-container-aws.yaml
        - apply:
            file: ../inject-vault-sidecar-github.yaml
        - apply:
            file: ../vault-github-permission-set-annotation.yaml

        - assert:
            timeout: 30s
            file: policy-ready.yaml

    - name: test-vault-annotation
      try:
        - apply:
            file: test-vault-annotation.yaml
            expect:
              - match:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: test-invalid-annotation
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'The annotation `vault.uw.systems/aws-role` must contain a valid role arn'))": true

    - name: test-vault-github-permission-set-annotation
      try:
        - apply:
            file: test-vault-github-permission-set-annotation.yaml
            expect:
              - match:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: test-github-no-permission-set
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'must carry a'))": true
              - match:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: test-github-invalid-permission-set
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'must carry a'))": true

    - name: create-test-pods
      try:
        - apply:
            file: test-inject-sidecar.yaml

    - name: inject-vault-sidecar-aws
      try:
        - assert:
            timeout: 30s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-aws-uw
                annotations:
                  uw.systems/kyverno-inject-sidecar-status: "injected"
              spec:
                initContainers:
                  - name: vault-credentials-agent-aws
                    <<: &aws-agent-base
                      image: quay.io/utilitywarehouse/vault-kube-cloud-credentials:v0.10.0
                      restartPolicy: Always
                      startupProbe:
                        exec:
                          command:
                            - /bin/sh
                            - -c
                            - while ! nc -w 1 127.0.0.1 8098; do sleep 1; done
                      args:
                        - sidecar
                        - (join('', ['-vault-role=test-env_aws_', $namespace, '_default']))
                      env:
                        - &vault-caurl
                          name: VAULT_CAURL
                          value: "http://vault-ca-cert.sys-vault:8100"
                        - &vault-addr
                          name: VAULT_ADDR
                          value: "https://vault.sys-vault:8200"
                      ports:
                        - name: metrics
                          containerPort: 8099
                          protocol: TCP
                      resources:
                        requests:
                          cpu: "0"
                          memory: 25Mi
                        limits:
                          cpu: "1"
                          memory: 100Mi
                containers:
                  - name: app
                    env: &app-aws-env
                      - name: AWS_CONTAINER_CREDENTIALS_FULL_URI
                        value: "http://127.0.0.1:8098/credentials"
                  - name: backend
                    env: *app-aws-env

    - name: inject-vault-sidecar-aws-gcp
      try:
        - assert:
            timeout: 30s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-aws-gcp-uw
                annotations:
                  uw.systems/kyverno-inject-sidecar-status: "injected"
              spec:
                initContainers:
                  - name: init
                    env: &app-aws-gcp-env
                      - name: AWS_CONTAINER_CREDENTIALS_FULL_URI
                        value: "http://127.0.0.1:8098/credentials"
                      - name: GCE_METADATA_HOST
                        value: "127.0.0.1:8198"
                      - name: GCE_METADATA_ROOT
                        value: "127.0.0.1:8198"
                  - name: vault-credentials-agent-aws
                    <<: *aws-agent-base
                  - name: vault-credentials-agent-gcp
                    image: quay.io/utilitywarehouse/vault-kube-cloud-credentials:v0.10.0
                    restartPolicy: Always
                    startupProbe:
                      exec:
                        command:
                          - /bin/sh
                          - -c
                          - while ! nc -w 1 127.0.0.1 8098; do sleep 1; done
                    args:
                      - sidecar
                      - (join('', ['-vault-static-account=test-env_gcp_', $namespace, '_default']))
                      - -secret-type=access_token
                      - -listen-address=127.0.0.1:8198
                      - -operational-address=:8199
                    env:
                      - name: GCE_METADATA_HOST
                        value: "127.0.0.1:8198"
                      - name: GCE_METADATA_ROOT
                        value: "127.0.0.1:8198"
                      - *vault-caurl
                      - *vault-addr
                    ports:
                      - name: metrics
                        containerPort: 8199
                        protocol: TCP
                    resources:
                      requests:
                        cpu: "0"
                        memory: 25Mi
                      limits:
                        cpu: "1"
                        memory: 100Mi
                containers:
                  - name: app
                    env: *app-aws-gcp-env
                  - name: backend
                    env: *app-aws-gcp-env

    - name: inject-vault-sidecar-gcp-key
      try:
        - assert:
            timeout: 30s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-gcp-key
                annotations:
                  uw.systems/kyverno-inject-sidecar-status: "injected"
              spec:
                volumes:
                  - projected:
                      defaultMode: 420
                  - name: gcp
                    emptyDir: {}
                initContainers:
                  - name: vault-credentials-agent-gcp-key
                    image: quay.io/utilitywarehouse/vault-kube-cloud-credentials:v0.10.0
                    restartPolicy: Always
                    startupProbe:
                      exec:
                        command:
                          - test
                          - -e
                          - /gcp/sa.json
                      failureThreshold: 5
                      periodSeconds: 15
                    args:
                      - sidecar
                      - (join('', ['-vault-static-account=test-env_gcp_', $namespace, '_default']))
                      - -secret-type=service_account_key
                      - -listen-address=127.0.0.1:8298
                      - -operational-address=:8299
                    env:
                      - name: GOOGLE_APPLICATION_CREDENTIALS
                        value: "/gcp/sa.json"
                      - *vault-caurl
                      - *vault-addr
                    ports:
                      - name: metrics
                        containerPort: 8299
                        protocol: TCP
                    resources:
                      requests:
                        cpu: "0"
                        memory: 25Mi
                      limits:
                        cpu: "1"
                        memory: 100Mi
                    volumeMounts:
                      - name: gcp
                        mountPath: /gcp
                      - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                containers:
                  - name: app
                    env:
                      - name: GOOGLE_APPLICATION_CREDENTIALS
                        value: "/gcp/sa.json"
                    volumeMounts:
                      - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                      - name: gcp
                        mountPath: /gcp

