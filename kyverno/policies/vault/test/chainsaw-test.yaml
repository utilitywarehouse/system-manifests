                    args:
                      - sidecar
                      - (join('', ['-vault-static-account=test-env_gcp_', $namespace, '_default']))
                      - -secret-type=access_token
                      - -listen-address=127.0.0.1:8198
                      - -operational-address=:8199
                    env:
                      - name: GCE_METADATA_HOST
                        value: "127.0.0.1:8198"
                      - name: GCE_METADATA_ROOT
                        value: "127.0.0.1:8198"
                      - *vault-caurl
                      - *vault-addr
                    ports:
                      - name: metrics
                        containerPort: 8199
                        protocol: TCP
                    resources:
                      requests:
                        cpu: "0"
                        memory: 25Mi
                      limits:
                        cpu: "1"
                        memory: 100Mi
                containers:
                  - name: app
                    env:
                      - name: GCE_METADATA_HOST
                        value: "127.0.0.1:8198"
                      - name: GCE_METADATA_ROOT
                        value: "127.0.0.1:8198"

    - name: inject-vault-sidecar-github
      try:
        - assert:
            timeout: 30s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-github
                annotations:
                  uw.systems/kyverno-inject-sidecar-status: "injected"
              spec:
                volumes:
                  - projected:
                      defaultMode: 420
                  - name: github-token
                    emptyDir: {}
                initContainers:
                  - name: vault-credentials-agent-github
                    <<: &github-agent-base
                      image: quay.io/utilitywarehouse/vault-kube-cloud-credentials:v0.10.0
                      restartPolicy: Always
                      startupProbe:
                        exec:
                          command:
                            - test
                            - -e
                            - /var/run/secrets/github/token
                        failureThreshold: 5
                        periodSeconds: 15
                      args:
                        - sidecar
                        - -vault-role=k8s_github_uw_ro
                        - -github-permission-set=uw_ro
                        - -listen-address=127.0.0.1:8398
                        - -operational-address=:8399
                      env:
                        - name: GITSYNC_PASSWORD_FILE
                          value: "/var/run/secrets/github/token"
                        - *vault-caurl
                        - *vault-addr
                      ports:
                        - name: metrics
                          containerPort: 8399
                          protocol: TCP
                      resources:
                        requests:
                          cpu: "0"
                          memory: 25Mi
                        limits:
                          cpu: "1"
                          memory: 100Mi
                      volumeMounts:
                        - name: github-token
                          mountPath: /var/run/secrets/github
                        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                containers:
                  - name: app
                    env: &app-github-env
                      - name: GITSYNC_PASSWORD_FILE
                        value: "/var/run/secrets/github/token"
                    volumeMounts:
                      - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                      - name: github-token
                        mountPath: /var/run/secrets/github

