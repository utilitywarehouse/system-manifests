apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: inject-vault-sidecar-github
  labels:
    uw.systems/kyverno-policy-group: vault-sidecar-injector
  annotations:
    policies.kyverno.io/title: Inject Sidecar - GitHub
spec:
  autogen:
    mutatingAdmissionPolicy:
      enabled: false
    podControllers:
      controllers: [] # disable autogen for other resources

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]

  matchConditions:
    - name: match-github-annotation
      expression: >-
        object.metadata.?annotations['vault.uw.systems/github-credentials'].orValue('') == 'token-file'
    # The permission set name (unlike the AWS/GCP identity, which is derived
    # only from the pod's own namespace/serviceAccountName) comes from a
    # free-form annotation value, so it's restricted to a safe character set
    # before it becomes part of the Vault role name and sidecar env. This is
    # not a trust boundary in itself (Vault's ACL on the auth role's policy is
    # what actually gates which permission sets can be read); it only keeps
    # the role name well-formed.
    - name: valid-permission-set-annotation
      expression: >-
        object.metadata.?annotations['github.uw.systems/permission-set'].orValue('').matches('^[a-zA-Z0-9_-]+$')
    # Skip already-injected pods so re-invocation can't add a duplicate.
    - name: not-already-injected
      expression: >-
        !object.spec.?initContainers.orValue([]).exists(c, c.?name.orValue('') == 'vault-credentials-agent-github')

  variables:
    - name: vkac_env
      expression: "'test-env'"

    - name: permission_set
      expression: "object.metadata.?annotations['github.uw.systems/permission-set'].orValue('')"

  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            metadata: Object.metadata{
              annotations: { "uw.systems/kyverno-inject-sidecar-status": "injected" }
            },
            spec: Object.spec{
              // Point existing initContainers at the credentials endpoint.
              initContainers: (has(object.spec.initContainers) ?
                  object.spec.initContainers.map(c,
                    Object.spec.initContainers{
                      name: c.name,
                      env: [
                        Object.spec.initContainers.env{ name: "GITSYNC_PASSWORD_FILE", value: "/var/run/secrets/github/token" }
                      ],
                      volumeMounts: [
                        Object.spec.initContainers.volumeMounts{ name: "github-token", mountPath: "/var/run/secrets/github" }
                      ]
                    }
                  ) : []) +
                [
                  // Append the vault credentials sidecar.
                  Object.spec.initContainers{
                    name: "vault-credentials-agent-github",
                    image: "quay.io/utilitywarehouse/vault-kube-cloud-credentials:v0.10.3",
                    restartPolicy: "Always",
                    env: [
                      Object.spec.initContainers.env{ name: "VKCC_VAULT_ROLE", value: "k8s_github_" + variables.permission_set },
                      Object.spec.initContainers.env{ name: "VKCC_GITHUB_PERMISSION_SET", value: variables.permission_set },
                      Object.spec.initContainers.env{ name: "VKCC_LISTEN_ADDRESS", value: "127.0.0.1:8398" },
                      Object.spec.initContainers.env{ name: "VKCC_OPERATIONAL_ADDRESS", value: ":8399" },
                      Object.spec.initContainers.env{ name: "GITSYNC_PASSWORD_FILE", value: "/var/run/secrets/github/token" },
                      Object.spec.initContainers.env{ name: "VAULT_CAURL", value: "http://vault-ca-cert.sys-vault:8100" },
                      Object.spec.initContainers.env{ name: "VAULT_ADDR", value: "https://vault.sys-vault:8200" }
                    ],
                    volumeMounts: [
                      Object.spec.initContainers.volumeMounts{ name: "github-token", mountPath: "/var/run/secrets/github" }
                    ],
                    ports: [
                      Object.spec.initContainers.ports{ name: "metrics", containerPort: 8399, protocol: "TCP" }
                    ],
                    startupProbe: Object.spec.initContainers.startupProbe{
                      httpGet: Object.spec.initContainers.startupProbe.httpGet{ path: "/__/ready", port: 8399 },
                      failureThreshold: 5,
                      periodSeconds: 15
                    },
                    resources: Object.spec.initContainers.resources{
                      requests: {"cpu": "0m", "memory": "25Mi"},
                      limits: {"cpu": "1000m", "memory": "100Mi"}
                    }
                  }
                ],
              // Point existing containers at the credentials endpoint too.
              containers: has(object.spec.containers) ?
                object.spec.containers.map(c,
                  Object.spec.containers{
                    name: c.name,
                    env: [
                      Object.spec.containers.env{ name: "GITSYNC_PASSWORD_FILE", value: "/var/run/secrets/github/token" }
                    ],
                    volumeMounts: [
                      Object.spec.containers.volumeMounts{ name: "github-token", mountPath: "/var/run/secrets/github" }
                    ]
                  }
                ) : [],
              volumes: [
                Object.spec.volumes{ name: "github-token", emptyDir: Object.spec.volumes.emptyDir{} }
              ]
            }
          }
