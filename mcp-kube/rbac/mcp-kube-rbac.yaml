apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-kube
  namespace: kube-system
  labels:
    app.kubernetes.io/name: mcp-kube
---
# Everything the MCP needs beyond the stock role is granted to `view` by
# rbac-aggregates, so there is no MCP-specific role to maintain.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-kube-view
  labels:
    app.kubernetes.io/name: mcp-kube
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: mcp-kube
    namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-kube-token
  annotations:
    kubernetes.io/service-account.name: mcp-kube
type: kubernetes.io/service-account-token
