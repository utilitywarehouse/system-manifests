apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-kube
  namespace: kube-system
  labels:
    app.kubernetes.io/name: mcp-kube
---
# Baseline read access. mcp-kube-viewer-extras only fills the gaps `view` leaves.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-kube-view
  labels:
    app.kubernetes.io/name: mcp-kube
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: mcp-kube
    namespace: kube-system
---
# The ClusterRole itself is generated by rbac.sh into mcp-kube-extras.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-kube-viewer-extras
  labels:
    app.kubernetes.io/name: mcp-kube
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-kube-viewer-extras
subjects:
  - kind: ServiceAccount
    name: mcp-kube
    namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-kube-token
  annotations:
    kubernetes.io/service-account.name: mcp-kube
type: kubernetes.io/service-account-token
