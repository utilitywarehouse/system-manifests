apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - upstream/pushgateway.yaml

patches:
  - target:
      kind: Deployment
      name: prometheus-pushgateway-shared
    patch: |
      - op: remove
        path: /metadata/namespace
      - op: remove
        path: /metadata/labels/app.kubernetes.io~1instance
      - op: remove
        path: /metadata/labels/helm.sh~1chart
      - op: remove
        path: /metadata/labels/app.kubernetes.io~1managed-by
      - op: remove
        path: /spec/selector/matchLabels/app.kubernetes.io~1instance
      - op: remove
        path: /spec/template/metadata/labels/app.kubernetes.io~1instance
      - op: remove
        path: /spec/template/metadata/labels/helm.sh~1chart
      - op: remove
        path: /spec/template/metadata/labels/app.kubernetes.io~1managed-by
  - target:
      kind: Service
      name: prometheus-pushgateway-shared
    patch: |
      - op: remove
        path: /metadata/namespace
      - op: remove
        path: /metadata/labels/app.kubernetes.io~1instance
      - op: remove
        path: /metadata/labels/helm.sh~1chart
      - op: remove
        path: /metadata/labels/app.kubernetes.io~1managed-by
      - op: remove
        path: /spec/selector/app.kubernetes.io~1instance
  - target:
      kind: ServiceAccount
      name: prometheus-pushgateway-shared
    patch: |
      - op: remove
        path: /metadata/namespace
      - op: remove
        path: /metadata/labels/app.kubernetes.io~1instance
      - op: remove
        path: /metadata/labels/helm.sh~1chart
      - op: remove
        path: /metadata/labels/app.kubernetes.io~1managed-by
