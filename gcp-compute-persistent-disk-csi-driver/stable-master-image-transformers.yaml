# Mirrors upstream's stable-master image tag transformer so we stay up-to-date
# on image tag versions:
# https://github.com/kubernetes-sigs/gcp-compute-persistent-disk-csi-driver/blob/master/deploy/kubernetes/images/stable-master/image.yaml
apiVersion: builtin
kind: ImageTagTransformer
metadata:
  name: imagetag-csi-provisioner
imageTag:
  name: registry.k8s.io/sig-storage/csi-provisioner
  newTag: "v6.0.0"
---
apiVersion: builtin
kind: ImageTagTransformer
metadata:
  name: imagetag-csi-attacher
imageTag:
  name: registry.k8s.io/sig-storage/csi-attacher
  newTag: "v4.8.1"
---
apiVersion: builtin
kind: ImageTagTransformer
metadata:
  name: imagetag-csi-resizer
imageTag:
  name: registry.k8s.io/sig-storage/csi-resizer
  newTag: "v2.0.0"
---
apiVersion: builtin
kind: ImageTagTransformer
metadata:
  name: imagetag-csi-snapshotter
imageTag:
  name: registry.k8s.io/sig-storage/csi-snapshotter
  newTag: "v8.2.1"
---
apiVersion: builtin
kind: ImageTagTransformer
metadata:
  name: imagetag-csi-node-registrar
imageTag:
  name: registry.k8s.io/sig-storage/csi-node-driver-registrar
  newTag: "v2.13.0"
---
apiVersion: builtin
kind: ImageTagTransformer
metadata:
  name: imagetag-gcepd-driver
imageTag:
  name: registry.k8s.io/cloud-provider-gcp/gcp-compute-persistent-disk-csi-driver
  newTag: "v1.26.0"
