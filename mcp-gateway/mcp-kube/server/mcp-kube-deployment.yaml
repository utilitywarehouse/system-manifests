apiVersion: v1
kind: Service
metadata:
  name: mcp-kube
  labels:
    app.kubernetes.io/name: mcp-kube
spec:
  type: ClusterIP
  ports:
    - name: mcp
      port: 8000
      targetPort: mcp
      protocol: TCP
  selector:
    app.kubernetes.io/name: mcp-kube
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-kube
  labels:
    app.kubernetes.io/name: mcp-kube
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-kube
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-kube
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: ca-fetch
          image: curlimages/curl:8.22.0
          restartPolicy: Always
          command:
            - /bin/sh
          args:
            - /scripts/fetch-ca.sh
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /scripts
              readOnly: true
            - name: ca
              mountPath: /certs
      containers:
        - name: mcp-kube
          image: ghcr.io/containers/kubernetes-mcp-server:v0.0.66
          args:
            - --port=8000
            - --bind-address=0.0.0.0
            - --read-only
            - --stateless # no tool/prompt change notifications; proxy friendly
            - --kubeconfig=/etc/mcp-kube/kubeconfig
            - --cluster-provider=kubeconfig
            - --config=/etc/mcp-kube/config.toml
          ports:
            - name: mcp
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/mcp-kube
              readOnly: true
            - name: tokens
              mountPath: /etc/mcp-kube/tokens
              readOnly: true
            - name: ca
              mountPath: /etc/mcp-kube/ca
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mcp-kube-config
        - name: tokens
          projected:
            sources:
              - secret:
                  name: mcp-kube-tokens
                  items:
                    - key: aws
                      path: aws
                    - key: gcp
                      path: gcp
                    - key: merit
                      path: merit
        - name: ca
          emptyDir: {}
