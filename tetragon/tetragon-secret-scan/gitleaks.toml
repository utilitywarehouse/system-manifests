title = "tetragon-cli-secrets"

# Extends the built-in gitleaks rules with CLI/argv-focused rules; it does NOT
# replace them (useDefault keeps every built-in detector active).
[extend]
useDefault = true

[[rules]]
id = "secret-assignment"
description = "Secret assigned via environment variable, JSON field or header"
regex = '''(?i)[\w.-]*(?:secret|token|password|passwd|credential|bearer|authorization|(?:api|access)[-_]?key)[\w.-]*["']?[ \t]*[:=][ \t]*["']?([A-Za-z0-9][^\s"',;]{5,})'''
secretGroup = 1
keywords = ["secret", "token", "password", "passwd", "credential", "bearer", "authorization", "api-key", "api_key", "apikey", "access-key", "access_key", "accesskey"]

[[rules]]
id = "secret-cli-flag"
description = "Secret passed as a CLI flag argument"
regex = '''(?i)(?:^|[ \t"'])-{1,2}[\w.-]*(?:secret|token|password|passwd|credential|bearer|authorization|(?:api|access)[-_]?key)[\w.-]*[ \t]+["']?([A-Za-z0-9][^\s"',;]{5,})'''
secretGroup = 1
keywords = ["secret", "token", "password", "passwd", "credential", "bearer", "authorization", "api-key", "api_key", "apikey", "access-key", "access_key", "accesskey"]
