# Disallow NodePort
#
# A Kubernetes Service of type NodePort uses a host port to receive
# traffic from any source. A NetworkPolicy cannot be used to control
# traffic to host ports. Although NodePort Services can be useful, their
# use must be limited to Services with additional upstream security
# checks. This policy validates that any new Services do not use the
# `NodePort` type.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restrict-nodeport
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  validations:
    - expression: >-
        !has(object.spec.type) || object.spec.type != 'NodePort'
      message: Services of type NodePort are not allowed.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: restrict-nodeport-binding
spec:
  policyName: restrict-nodeport
  validationActions: ["Deny"]
