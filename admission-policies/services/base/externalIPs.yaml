# Restrict External IPs
#
# Service externalIPs can be used for a MITM attack (CVE-2020-8554).
# Restrict externalIPs or limit to a known set of addresses. See:
# https://github.com/kyverno/kyverno/issues/1367. This policy validates
# that the `externalIPs` field is not set on a Service.
#
# Upstream: https://kyverno.io/policies/best-practices/restrict-service-external-ips/restrict-service-external-ips/
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restrict-external-ips
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  validations:
    - expression: >-
        !has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0
      message: externalIPs are not allowed.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: restrict-external-ips-binding
spec:
  policyName: restrict-external-ips
  validationActions: ["Deny"]
