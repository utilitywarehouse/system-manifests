# Two exceptions on the same policy, as happens in real clusters: each one is
# a single negated condition, and VAP ands all match conditions together.
- op: add
  path: /spec/matchConditions
  value:
    - name: test-nodeport-exception-one
      expression: >-
        !(
          object.metadata.namespace == 'default' &&
          object.metadata.name == 'test-nodeport-exception-allowed' &&
          object.spec.ports.all(p, !has(p.nodePort) || p.nodePort == 30961)
        )
    - name: test-nodeport-exception-two
      expression: >-
        !(
          object.metadata.namespace == 'default' &&
          object.metadata.name == 'test-nodeport-exception-allowed-two' &&
          object.spec.ports.all(p, !has(p.nodePort) || p.nodePort == 30962)
        )
