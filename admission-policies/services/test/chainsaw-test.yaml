apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: test-service-admission-policies
spec:
  steps:
    - name: setup-prerequisites
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: sys-ingress-certs
                labels:
                  uw.systems/owner: system

    # What a cluster does: render the shared base with that cluster's exception
    # patches and apply the result. No Kyverno involved.
    - name: apply-admission-policies
      try:
        - script:
            timeout: 120s
            content: |
              set -eu
              kubectl kustomize --load-restrictor LoadRestrictionsNone . \
                | kubectl apply -f -

    - name: assert-admission-policies
      try:
        - assert:
            timeout: 60s
            file: vap-ready.yaml

    - name: test-external-ips
      try:
        - apply:
            timeout: 2m
            file: test-externalIPs.yaml
            expect:
              - match:
                  apiVersion: v1
                  kind: Service
                  metadata: { name: test-externalip-not-allowed }
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'externalIPs are not allowed'))": true

    - name: test-external-name
      try:
        - apply:
            timeout: 2m
            file: test-externalName.yaml
            expect:
              - match:
                  apiVersion: v1
                  kind: Service
                  metadata: { name: test-externalname-block }
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'ExternalName cannot point to localhost'))": true
              - match:
                  apiVersion: v1
                  kind: Service
                  metadata: { name: test-externalname-as-ip-block }
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'ExternalName cannot point to localhost'))": true

    - name: test-load-balancer-ip
      try:
        - apply:
            timeout: 2m
            file: test-loadbalancerIP.yaml
            expect:
              - match:
                  apiVersion: v1
                  kind: Service
                  metadata: { name: test-loadbalancerip-not-allowed }
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'loadBalancerIP is not allowed.'))": true

    - name: test-node-port
      try:
        - apply:
            timeout: 2m
            file: test-nodePort.yaml
            expect:
              - match:
                  apiVersion: v1
                  kind: Service
                  metadata: { name: test-nodeport-not-allowed }
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'Services of type NodePort are not allowed.'))": true

    - name: test-mirror-name-length
      try:
        - apply:
            timeout: 2m
            file: test-semaphore-service-mirror-length.yaml
            expect:
              - match:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    {
                      name: test-very-very-very-very-very-very-very-very-long-name-svc,
                    }
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'Mirror service controller should be able to generate 63 chars long'))": true
              - match:
                  apiVersion: v1
                  kind: Service
                  metadata: { name: broadband-product-availability-app }
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'Mirror service controller should be able to generate 63 chars long'))": true
