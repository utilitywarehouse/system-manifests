# Ensure Namespace Name Labels
#
# Make sure every namespace has a `name` label that matches the actual
# namespace name.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: ensure-ns-name-label
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: needs-name-label
      expression: >-
        !('name' in object.metadata.?labels.orValue({})) || object.metadata.labels['name'] != object.metadata.name
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{
              labels: {
                "name": object.metadata.name
              }
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: ensure-ns-name-label-binding
spec:
  policyName: ensure-ns-name-label
