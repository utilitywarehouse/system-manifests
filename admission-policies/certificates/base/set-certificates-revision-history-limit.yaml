apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: set-certificates-revision-history-limit
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        resources: ["certificates"]
        operations: ["CREATE", "UPDATE"]
  matchConditions:
    - name: revision-history-is-not-set
      expression: "!has(object.spec.revisionHistoryLimit)"
  reinvocationPolicy: Never
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            spec: Object.spec{
              revisionHistoryLimit: 2
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: set-certificates-revision-history-limit-binding
spec:
  policyName: set-certificates-revision-history-limit
