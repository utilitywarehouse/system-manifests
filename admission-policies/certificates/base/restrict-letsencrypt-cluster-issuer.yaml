# Restrict Let's Encrypt ClusterIssuer
#
# This policy helps us track issuer usage. To ensure the Infra team has
# visibility into certificates issued by Let's Encrypt under the 'uw.systems'
# domain.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restrict-letsencrypt-cluster-issuer
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        resources: ["certificates"]
        operations: ["CREATE", "UPDATE"]
  matchConditions:
    - name: is-uw-systems-domain
      expression: >-
        has(object.spec.dnsNames) &&
        object.spec.dnsNames.exists(domain, domain.endsWith('.uw.systems'))
  validations:
    - expression: >-
        !(
          object.spec.issuerRef.name == 'letsencrypt' &&
          object.spec.issuerRef.kind == 'ClusterIssuer'
        )
      message: >-
        Direct use of 'letsencrypt' for *.uw.systems is restricted for visibility.
        Please create a 'PolicyException' in kube-system and reach out to us on #infra.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: restrict-letsencrypt-cluster-issuer-binding
spec:
  policyName: restrict-letsencrypt-cluster-issuer
  validationActions: ["Deny"]
