apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: test-certificates-admission-policies
spec:
  steps:
    # These tests do not install Kyverno, so bring the Certificate CRD the
    # fixtures need.
    - name: setup-prerequisites
      try:
        - script:
            timeout: 180s
            content: |
              set -eu
              kubectl apply -f /repo/kyverno/e2e-deploy/certificates-crd.yaml
              kubectl wait --for=condition=Established --timeout=60s \
                crd/certificates.cert-manager.io
        - apply:
            file: prerequisite-resources.yaml

    # What a cluster does: render the shared base with that cluster's exception
    # patches and apply the result. No Kyverno involved.
    - name: apply-admission-policies
      try:
        - script:
            timeout: 120s
            content: |
              set -eu
              kubectl kustomize --load-restrictor LoadRestrictionsNone . \
                | kubectl apply -f -

    - name: assert-admission-policies
      try:
        - assert:
            timeout: 60s
            file: vap-ready.yaml
        - assert:
            timeout: 60s
            file: map-ready.yaml

    - name: test-resources
      try:
        - apply:
            timeout: 2m
            file: resources.yaml
            expect:
              # confirm validation failures
              - match:
                  apiVersion: cert-manager.io/v1
                  kind: Certificate
                  metadata:
                    name: letsencrypt-cert
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'is restricted for visibility'))": true

              - match:
                  apiVersion: cert-manager.io/v1
                  kind: Certificate
                  metadata:
                    name: letsencrypt-cert-not-approved
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'is restricted for visibility'))": true

              - match:
                  apiVersion: cert-manager.io/v1
                  kind: Certificate
                  metadata:
                    name: letsencrypt-cert-team-d-not-approved
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'is restricted for visibility'))": true

        # assert mutations
        - assert:
            resource:
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: without-revision-history
                namespace: team-a
              spec:
                revisionHistoryLimit: 2

        - assert:
            resource:
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: with-revision-history
                namespace: team-a
              spec:
                revisionHistoryLimit: 10
