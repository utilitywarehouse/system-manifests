apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: test-ingress-admission-policies
spec:
  steps:
    # The fixtures use Traefik CRDs (IngressRoute, IngressRouteTCP, TLSOption).
    # The Kyverno suite gets them from its install manifests; these tests do not
    # install Kyverno, so add them here.
    - name: setup-crds
      try:
        - script:
            timeout: 180s
            content: |
              set -eu
              kubectl kustomize /repo/traefik/cluster/crds/traefik/crds | kubectl apply -f -
              kubectl wait --for=condition=Established --timeout=60s \
                crd/ingressroutes.traefik.io \
                crd/ingressroutetcps.traefik.io \
                crd/tlsoptions.traefik.io

    # What a cluster does: render the shared base with that cluster's exception
    # patches and apply the result. No Kyverno involved.
    - name: apply-admission-policies
      try:
        - script:
            timeout: 120s
            content: |
              set -eu
              kubectl kustomize --load-restrictor LoadRestrictionsNone . \
                | kubectl apply -f -

    - name: assert-admission-policies
      try:
        - assert:
            timeout: 60s
            file: vap-ready.yaml

    - name: test-tlsoption-non-admin
      try:
        - apply:
            file: test-tlsoption.yaml
            expect:
              - match:
                  apiVersion: traefik.io/v1alpha1
                  kind: TLSOption
                  metadata:
                    name: default
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'Only cluster administrators are allowed to set default TLSOptions'))": true

    - name: test-ingress-validations
      try:
        - apply:
            file: test-disallow-or-operator.yaml
            expect:
              - match:
                  apiVersion: traefik.io/v1alpha1
                  kind: IngressRouteTCP
                  metadata:
                    name: test-or-operator-not-allowed-ingressroutetcp
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'Route matches must not contain ||'))": true
              - match:
                  apiVersion: traefik.io/v1alpha1
                  kind: IngressRoute
                  metadata:
                    name: test-or-operator-not-allowed-ingressroute
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'Route matches must not contain ||'))": true
              - match:
                  apiVersion: traefik.io/v1alpha1
                  kind: IngressRoute
                  metadata:
                    name: test-or-operator-complex-not-allowed-ingressroute
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'Route matches must not contain ||'))": true

        - apply:
            file: test-disallow-wildcard-hostsni.yaml
            expect:
              - match:
                  apiVersion: traefik.io/v1alpha1
                  kind: IngressRouteTCP
                  metadata:
                    name: test-wildcard-hostsni-not-allowed
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'HostSNI rules must not contain a wildcard host'))": true
              - match:
                  apiVersion: traefik.io/v1alpha1
                  kind: IngressRouteTCP
                  metadata:
                    name: test-wildcard-subdomain-hostsni-not-allowed
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'HostSNI rules must not contain a wildcard host'))": true
              - match:
                  apiVersion: traefik.io/v1alpha1
                  kind: IngressRouteTCP
                  metadata:
                    name: test-wildcard-hostsni-not-allowed-multiple-routes
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'HostSNI rules must not contain a wildcard host'))": true

        - apply:
            file: test-external-dns-domain-label-length.yaml
            expect:
              - match:
                  apiVersion: networking.k8s.io/v1
                  kind: Ingress
                  metadata:
                    name: test-long-invalid-domain-label
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'External-DNS TXT record domain label must be <= 63 chars'))": true

        - apply:
            file: test-require-ingressroute-host.yaml
            expect:
              - match:
                  apiVersion: networking.k8s.io/v1
                  kind: Ingress
                  metadata:
                    name: without-host
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'Ingresses must specify a host'))": true
              - match:
                  apiVersion: traefik.io/v1alpha1
                  kind: IngressRoute
                  metadata:
                    name: test-require-ingressroute-host-missing
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'All route matches must contain a Host rule'))": true
              - match:
                  apiVersion: traefik.io/v1alpha1
                  kind: IngressRoute
                  metadata:
                    name: test-require-ingressroute-bad-host
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'All route matches must contain a Host rule'))": true
