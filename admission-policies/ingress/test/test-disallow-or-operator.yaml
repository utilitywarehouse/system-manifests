apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: test-or-operator-not-allowed-ingressroutetcp
spec:
  routes:
    - match: HostSNI(`example.com || example.co.uk`)
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: test-or-operator-not-allowed-ingressroute
spec:
  routes:
    # The Host rule keeps this fixture out of the require-ingressroute-host
    # policy, so the only possible denial is the || check.
    - match: Host(`example.com`) && Headers(`X-Env`, `prod||staging`)
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: test-or-operator-complex-not-allowed-ingressroute
spec:
  routes:
    # Two valid Host rules, so again only the || check can deny this.
    - match: Host(`example.com`) && PathPrefix(`/api`) || Host(`api.example.com`) && PathPrefix(`/v2`)
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: test-or-operator-valid
spec:
  routes:
    - match: Host(`example.com`)
