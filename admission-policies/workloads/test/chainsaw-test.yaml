apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: test-workloads-admission-policies
spec:
  steps:
    # What a cluster does: render the shared base with that cluster's exception
    # patches and apply the result. No Kyverno involved.
    - name: apply-admission-policies
      try:
        - script:
            timeout: 120s
            content: |
              set -eu
              kubectl kustomize --load-restrictor LoadRestrictionsNone . \
                | kubectl apply -f -

    - name: assert-admission-policies
      try:
        - assert:
            timeout: 60s
            file: map-ready.yaml

    # The binding can take a moment to reach the API server, so prove the
    # policy mutates before asserting on the real fixtures.
    - name: wait-for-policy
      try:
        - script:
            timeout: 120s
            content: |
              set -eu
              for i in $(seq 1 60); do
                name="policy-canary-$i"
                kubectl create deployment "$name" --image=nginx >/dev/null
                value=$(kubectl get deployment "$name" -o jsonpath='{.spec.revisionHistoryLimit}')
                kubectl delete deployment "$name" --wait=false >/dev/null 2>&1 || true
                if [ "$value" = "2" ]; then
                  exit 0
                fi
                sleep 1
              done
              echo "the policy did not mutate a canary deployment" >&2
              exit 1

    - name: test-resources
      try:
        - apply:
            file: resources.yaml

        # Workloads left at the default (or explicitly 10) are capped to 2.
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: without-revision-history
                namespace: default
              spec:
                revisionHistoryLimit: 2

        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: with-default-revision-history
                namespace: default
              spec:
                revisionHistoryLimit: 10

        - assert:
            resource:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: without-revision-history
                namespace: default
              spec:
                revisionHistoryLimit: 2

        - assert:
            resource:
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: without-revision-history
                namespace: default
              spec:
                revisionHistoryLimit: 2

        # An explicitly set non-default value is respected.
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: with-custom-revision-history
                namespace: default
              spec:
                revisionHistoryLimit: 5
