# https://kyverno.io/policies/pod-security/baseline/disallow-privileged-containers/disallow-privileged-containers/
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: disallow-privileged-containers
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: >-
        has(object.spec.template) ? object.spec.template.spec :
        has(object.spec.jobTemplate) ? object.spec.jobTemplate.spec.template.spec :
        object.spec
    - name: allContainers
      expression: >-
        variables.podSpec.?containers.orValue([]) + 
        variables.podSpec.?initContainers.orValue([]) + 
        variables.podSpec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c, 
          c.?securityContext.?privileged.orValue(false) == false
        )
      messageExpression: >-
        'Privileged mode is disallowed. The following containers have privileged set to true: ' + 
        variables.allContainers.filter(c, c.?securityContext.?privileged.orValue(false) == true).map(c, c.name).join(', ')
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: disallow-privileged-containers-binding
spec:
  policyName: disallow-privileged-containers
  validationActions: ["Deny"]
