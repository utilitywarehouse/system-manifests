apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restrict-sysctls
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: >-
        has(object.spec.template) ? object.spec.template.spec :
        has(object.spec.jobTemplate) ? object.spec.jobTemplate.spec.template.spec :
        object.spec

  validations:
    - expression: >-
        variables.podSpec.?securityContext.?sysctls.orValue([]).all(s, 
          s.name in [
            'kernel.shm_rmid_forced', 
            'net.ipv4.ip_local_port_range', 
            'net.ipv4.ip_unprivileged_port_start', 
            'net.ipv4.tcp_syncookies', 
            'net.ipv4.ping_group_range'
          ]
        )
      messageExpression: >-
        'Setting additional sysctls above the allowed type is disallowed. Invalid sysctls found: ' + 
        variables.podSpec.?securityContext.?sysctls.orValue([]).filter(s, !(s.name in [
          'kernel.shm_rmid_forced', 
          'net.ipv4.ip_local_port_range', 
          'net.ipv4.ip_unprivileged_port_start', 
          'net.ipv4.tcp_syncookies', 
          'net.ipv4.ping_group_range'
        ])).map(s, s.name).join(', ')
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: restrict-sysctls-binding
spec:
  policyName: restrict-sysctls
  validationActions: ["Deny"]
