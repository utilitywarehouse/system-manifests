apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: disallow-selinux
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: >-
        has(object.spec.template) ? object.spec.template.spec :
        has(object.spec.jobTemplate) ? object.spec.jobTemplate.spec.template.spec :
        object.spec
    - name: allContainers
      expression: >-
        variables.podSpec.?containers.orValue([]) + 
        variables.podSpec.?initContainers.orValue([]) + 
        variables.podSpec.?ephemeralContainers.orValue([])
  validations:
    # Rule 1: selinux-type
    - expression: >-
        variables.podSpec.?securityContext.?seLinuxOptions.?type.orValue('container_t') in ['container_t', 'container_init_t', 'container_kvm_t'] &&
        variables.allContainers.all(c, 
          c.?securityContext.?seLinuxOptions.?type.orValue('container_t') in ['container_t', 'container_init_t', 'container_kvm_t']
        )
      message: >-
        Setting the SELinux type is restricted. The fields
        spec.securityContext.seLinuxOptions.type, spec.containers[*].securityContext.seLinuxOptions.type,
        , spec.initContainers[*].securityContext.seLinuxOptions, and spec.ephemeralContainers[*].securityContext.seLinuxOptions.type
        must either be unset or set to one of the allowed values (container_t, container_init_t, or container_kvm_t).

    # Rule 2: selinux-user-role
    - expression: >-
        variables.podSpec.?securityContext.?seLinuxOptions.?user.orValue('') == '' && 
        variables.podSpec.?securityContext.?seLinuxOptions.?role.orValue('') == '' &&
        variables.allContainers.all(c, 
          c.?securityContext.?seLinuxOptions.?user.orValue('') == '' && 
          c.?securityContext.?seLinuxOptions.?role.orValue('') == ''
        )
      message: >-
        Setting the SELinux user or role is forbidden. The fields
        spec.securityContext.seLinuxOptions.user, spec.securityContext.seLinuxOptions.role,
        spec.containers[*].securityContext.seLinuxOptions.user, spec.containers[*].securityContext.seLinuxOptions.role,
        spec.initContainers[*].securityContext.seLinuxOptions.user, spec.initContainers[*].securityContext.seLinuxOptions.role,
        spec.ephemeralContainers[*].securityContext.seLinuxOptions.user, and spec.ephemeralContainers[*].securityContext.seLinuxOptions.role
        must be unset.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: disallow-selinux-binding
spec:
  policyName: disallow-selinux
  validationActions: ["Deny"]
