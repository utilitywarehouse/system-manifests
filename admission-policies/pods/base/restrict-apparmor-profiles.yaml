# Restrict AppArmor
#
# On supported hosts, the 'runtime/default' AppArmor profile is applied by default.
# The default policy should prevent overriding or disabling the policy, or restrict
# overrides to an allowed set of profiles. This policy ensures Pods do not
# specify any other AppArmor profiles than `runtime/default` or `localhost/*`.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restrict-apparmor-profiles
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podMetadata
      expression: >-
        has(object.spec.template) ? object.spec.template.metadata :
        has(object.spec.jobTemplate) ? object.spec.jobTemplate.spec.template.metadata :
        object.metadata

  validations:
    - message: >-
        Specifying other AppArmor profiles is disallowed. The annotation
        `container.apparmor.security.beta.kubernetes.io` if defined
        must not be set to anything other than `runtime/default` or `localhost/*`.
      expression: >-
        !has(variables.podMetadata.annotations) ||
        variables.podMetadata.annotations.all(k,
          !k.startsWith('container.apparmor.security.beta.kubernetes.io/') ||
          variables.podMetadata.annotations[k] == 'runtime/default' ||
          variables.podMetadata.annotations[k].startsWith('localhost/')
        )
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: restrict-apparmor-profiles-binding
spec:
  policyName: restrict-apparmor-profiles
  validationActions: ["Deny"]
