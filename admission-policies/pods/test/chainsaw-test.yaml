apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: test-pod-security-policies
spec:
  steps:
    - name: apply-policies
      try:
        - script:
            timeout: 120s
            content: |
              set -eu
              kubectl kustomize --load-restrictor LoadRestrictionsNone . | kubectl apply -f -

    - name: assert-vap-generated
      try:
        - assert:
            timeout: 120s
            file: vap-ready.yaml

    - name: test-ephemeral-container
      try:
        - apply:
            file: test-ephemeral-target.yaml
        - assert:
            timeout: 60s
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: test-ephemeral-target
                namespace: default
              status:
                updatedReplicas: 1
        - script:
            timeout: 120s
            content: |
              set -e
              pod=$(kubectl get pods -l app=test-ephemeral-target -o jsonpath='{.items[0].metadata.name}')
              if kubectl patch pod "$pod" --subresource=ephemeralcontainers --type=merge \
                -p '{"spec":{"ephemeralContainers":[{"name":"dbg","image":"alpine","targetContainerName":"target","securityContext":{"privileged":true}}]}}' \
                2>&1 | grep -q 'Privileged mode is disallowed'; then
                echo "privileged ephemeral container denied"
              else
                echo "expected the privileged ephemeral container to be denied"
                exit 1
              fi
              kubectl patch pod "$pod" --subresource=ephemeralcontainers --type=merge \
                -p '{"spec":{"ephemeralContainers":[{"name":"dbg","image":"alpine","targetContainerName":"target"}]}}' >/dev/null
              echo "plain ephemeral container allowed"

    - name: test-apparmor
      try:
        - apply:
            file: test-apparmor.yaml
            expect:
              - match:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: test-apparmor-unconfined
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'Specifying other AppArmor profiles is disallowed'))": true

    - name: test-pod-capabilities
      try:
        - apply:
            timeout: 2m
            file: test-capabilities.yaml
            expect:
              - match:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: test-capabilities-forbidden
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'Any capabilities added other than NET_BIND_SERVICE'))": true

        - assert:
            timeout: 30s
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: test-capabilities-exception-deployment-allowed
                namespace: default
              status:
                updatedReplicas: 1

    - name: test-host-ipc
      try:
        - apply:
            timeout: 2m
            file: test-hostIPC.yaml
            expect:
              - match:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: test-hostipc-set-to-true
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'HostIPC pods are disallowed'))": true

        - assert:
            timeout: 30s
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: test-hostipc-set-to-true-exception-deployment-allow
                namespace: default
              status:
                updatedReplicas: 1

    - name: test-host-network
      try:
        - apply:
            timeout: 2m
            file: test-hostNetwork.yaml
            expect:
              - match:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: test-host-network-set-to-true
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'HostNetwork pods are disallowed'))": true

        - assert:
            timeout: 30s
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: test-host-network-set-to-true-exception-deployment-allow
                namespace: default
              status:
                updatedReplicas: 1

    - name: test-hostpath-volumes
      try:
        - apply:
            timeout: 2m
            file: test-hostpath.yaml
            expect:
              - match:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: test-hostpath-forbidden
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'HostPath volumes are not allowed.'))": true
              - match:
                  apiVersion: batch/v1
                  kind: CronJob
                  metadata:
                    name: test-hostpath-cronjob-fail
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'HostPath volumes are not allowed.'))": true

        - assert:
            timeout: 60s
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: test-hostpath-deployment-allow
                namespace: default
              status:
                updatedReplicas: 1

        - assert:
            timeout: 30s
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: test-hostpath-exception-deployment-allow
                namespace: kube-system
              status:
                updatedReplicas: 1

    - name: test-host-pid-and-ports
      try:
        - apply:
            timeout: 2m
            file: test-host-pid-ports.yaml
            expect:
              - match:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: test-hostpid-true
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'HostPID pods are disallowed'))": true
              - match:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: test-hostport-forbidden
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'Use of host ports is disallowed'))": true

        - assert:
            timeout: 30s
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: test-hostport-exception-deployment-allow
                namespace: kube-system
              status:
                updatedReplicas: 1

    - name: test-node-scheduling
      try:
        - apply:
            file: test-scheduling.yaml
            expect:
              - match:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: test-scheduling-master-forbidden
                check:
                  ($error != null): true
              - match:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: test-scheduling-control-plane-forbidden
                check:
                  ($error != null): true

        - assert:
            timeout: 30s
            resource:
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: test-scheduling-excluded-namespace-ds
                namespace: sys-mon
              status:
                updatedNumberScheduled: 1

    - name: test-privilege-combined
      try:
        - apply:
            timeout: 2m
            file: test-privilege-combined.yaml
            expect:
              - match:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: test-privilege-escalation-set-to-true
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'Privilege escalation is disallowed'))": true
              - match:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: test-privileged-container-fail
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'Privileged mode is disallowed'))": true
              - match:
                  apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: test-privileged-deployment-fail
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'Privileged mode is disallowed'))": true

    - name: test-proc-mount
      try:
        - apply:
            file: test-procmount.yaml
            expect:
              - match:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: test-procmount-init-forbidden
                check:
                  ($error != null): true
              - match:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: test-procmount-unmasked
                check:
                  ($error != null): true

    - name: test-security-settings
      try:
        - apply:
            file: test-security-settings.yaml
            expect:
              - match:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: test-seccomp-init-forbidden
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'Use of custom Seccomp profiles is disallowed'))": true
              - match:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: test-selinux-forbidden
                check:
                  ($error != null): true
                  # Note: This checks for either of the two SELinux rule error messages
                  "(contains(to_string($error), 'Setting the SELinux type is restricted') || contains($error, 'Setting the SELinux user or role is forbidden'))": true
              - match:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: test-sysctls-forbidden
                check:
                  ($error != null): true


    - name: test-user-namespaces
      try:
        # MutatingAdmissionPolicies are compiled asynchronously after apply; a pod
        # created before the policy is active is never mutated, so poll a canary.
        - script:
            timeout: 180s
            content: |
              set -eu
              for i in $(seq 1 60); do
                kubectl delete pod canary-unns --ignore-not-found --wait=false >/dev/null 2>&1 || true
                kubectl run canary-unns --image=alpine --restart=Never >/dev/null 2>&1 || true
                v=$(kubectl get pod canary-unns -o jsonpath='{.spec.hostUsers}' 2>/dev/null || true)
                if [ "$v" = "false" ]; then
                  kubectl delete pod canary-unns --wait=false >/dev/null 2>&1 || true
                  exit 0
                fi
                sleep 1
              done
              echo "the MutatingAdmissionPolicy did not set hostUsers" >&2
              exit 1
        - apply:
            file: test-user-namespaces.yaml
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-unns-default
              spec:
                hostUsers: false
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-unns-skip
              spec:
                (hostUsers == null): true
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-unns-explicit
              spec:
                hostUsers: false
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-unns-enabled
              spec:
                hostUsers: false
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-unns-host-network
              spec:
                (hostUsers == null): true
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-unns-host-pid
              spec:
                (hostUsers == null): true
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-unns-host-ipc
              spec:
                (hostUsers == null): true
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-unns-hostpath
              spec:
                (hostUsers == null): true
