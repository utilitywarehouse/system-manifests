# The policy exceptions from the Kyverno suite, as negated match conditions.
- op: add
  path: /spec/matchConditions
  value:
    - name: etcd-backup-disallow-host-network-pods
      expression: "!(object.metadata.?namespace.orValue('') == 'default' && object.metadata.name.startsWith('test-host-network-set-to-true-exception'))"
