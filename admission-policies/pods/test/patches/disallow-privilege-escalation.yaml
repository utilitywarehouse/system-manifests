# The policy exceptions from the Kyverno suite, as negated match conditions.
- op: add
  path: /spec/matchConditions
  value:
    - name: trident-disallow-privilege-escalation
      expression: "!(object.metadata.?namespace.orValue('') == 'default' && object.metadata.name.startsWith('test-privilege-escalation-set-to-true-exception'))"
