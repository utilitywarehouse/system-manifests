# The policy exceptions from the Kyverno suite, as negated match conditions.
- op: add
  path: /spec/matchConditions
  value:
    - name: kured-disallow-host-pid-pods
      expression: "!(object.metadata.?namespace.orValue('') == 'default' && object.metadata.name.startsWith('test-hostpid-true-exceptions'))"
    - name: test-unns-host-pid
      expression: "!(object.metadata.name == 'test-unns-host-pid')"
