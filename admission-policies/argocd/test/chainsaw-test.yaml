apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: test-argocd-admission-policies
spec:
  steps:
    # The fixtures use the ArgoCD Application CRD. The Kyverno suite gets it
    # from its install manifests; these tests do not install Kyverno, so add it
    # here.
    - name: setup-crds
      try:
        - script:
            timeout: 180s
            content: |
              set -eu
              kubectl apply --server-side --force-conflicts -f /repo/argocd/cluster/upstream/CustomResourceDefinition.yaml
              # The CRD status can be empty for a moment right after the apply.
              for i in $(seq 1 30); do
                kubectl wait --for=condition=Established --timeout=5s \
                  crd/applications.argoproj.io \
                  crd/appprojects.argoproj.io \
                  crd/applicationsets.argoproj.io && break
                sleep 2
              done

    # What a cluster does: render the shared base with that cluster's exception
    # patches and apply the result. No Kyverno involved.
    - name: apply-admission-policies
      try:
        - script:
            timeout: 120s
            content: |
              set -eu
              kubectl kustomize --load-restrictor LoadRestrictionsNone . \
                | kubectl apply -f -

    - name: assert-admission-policies
      try:
        - assert:
            timeout: 60s
            file: vap-ready.yaml

    - name: test-argocd-application-field-validation
      try:
        - apply:
            file: test-application-field-validation.yaml
            expect:
              - match:
                  apiVersion: argoproj.io/v1alpha1
                  kind: Application
                  metadata:
                    name: test-source-path-specified
                check:
                  ($error == null): true

              - match:
                  apiVersion: argoproj.io/v1alpha1
                  kind: Application
                  metadata:
                    name: test-multiple-source-path-specified
                check:
                  ($error == null): true

              - match:
                  apiVersion: argoproj.io/v1alpha1
                  kind: Application
                  metadata:
                    name: test-default-project
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'The `default` is a privileged project and it may not be used in an Application'))": true

              - match:
                  apiVersion: argoproj.io/v1alpha1
                  kind: Application
                  metadata:
                    name: test-missing-project-name
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'spec.project: Required value'))": true

              - match:
                  apiVersion: argoproj.io/v1alpha1
                  kind: Application
                  metadata:
                    name: test-missing-source-path
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'When using `spec.source`, a `path` must be defined'))": true

              - match:
                  apiVersion: argoproj.io/v1alpha1
                  kind: Application
                  metadata:
                    name: test-source-and-sources-both-specified
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'An Application must define exactly one: either `spec.source` OR `spec.sources`'))": true

              - match:
                  apiVersion: argoproj.io/v1alpha1
                  kind: Application
                  metadata:
                    name: test-source-path-chart-specified
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'Helm charts are not permitted in `spec.source`. Please use a git path'))": true

              - match:
                  apiVersion: argoproj.io/v1alpha1
                  kind: Application
                  metadata:
                    name: test-sources-chart-specified
                check:
                  ($error != null): true
                  "(contains(to_string($error), 'Every entry in `spec.sources` must specify a `path`'))": true

              - match:
                  apiVersion: argoproj.io/v1alpha1
                  kind: Application
                  metadata:
                    name: test-missing-destination-namespace
                check:
                  ($error != null): true
                  "(contains(to_string($error), '`spec.destination.namespace` should not be empty'))": true

    # The policies are cluster-scoped and stay applied, like every other group.
