# The base spec is the source of truth and the behavioural tests prove that
# every policy denies and allows the right objects. What is left to check is
# that the API server compiled each policy at its current revision and that CEL
# type checking found nothing to warn about.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: argocd-application-field-validation
(status.observedGeneration == metadata.generation): true
(length(status.typeChecking.expressionWarnings || `[]`)): 0
