# Validate Vault AWS role arn
#
# Verify that `vault.uw.systems/aws-role` annotation contains a valid role
# arn

apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vault-aws-role-arn
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["serviceaccounts"]
  validations:
    - expression: >-
        has(object.metadata.annotations) && 'vault.uw.systems/aws-role' in object.metadata.annotations ? 
        object.metadata.annotations['vault.uw.systems/aws-role'].matches('^arn:aws:iam::[0-9]+:role/[a-zA-Z0-9_+=,.@-]+') : true
      message: "The annotation `vault.uw.systems/aws-role` must contain a valid role arn"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: vault-aws-role-arn-binding
spec:
  policyName: vault-aws-role-arn
  validationActions:
    - Deny
